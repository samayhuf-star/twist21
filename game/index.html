<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Twist 21</title>
<style>
:root {
  --ink: #0b1a14; --felt: #12583b; --felt2: #0b3d29; --rail: #3a2216; --rail2: #5b3a22;
  --gold: #e8c46a; --gold2: #b8893a; --paper: #f6f0e2; --paper-ink: #1a1510;
  --hot: #e4572e; --mint: #4fe0a0; --rose: #ff5a73; --muted: #9fc3b0; --glass: rgba(0,0,0,.32);
  --lo: #4aa8c7; --mid: #9a7bd6; --hi: #e0647a;
  --back1: #7a1230; --back2: #4d0a1e;
  --d-skin: #f1c9a0; --d-hair: #2a1b12; --d-vest: #7a1230; --d-tie: #e8c46a;
  --display: 'Georgia', 'Times New Roman', serif; --ui: -apple-system, 'SF Pro Rounded', system-ui, 'Segoe UI', sans-serif;
  --cw: 44px; --ch: 62px; color-scheme: dark;
}
body[data-felt="midnight"] { --felt: #17306a; --felt2: #0d1d45; }
body[data-felt="crimson"]  { --felt: #7b1f2e; --felt2: #4a0f19; }
body[data-felt="violet"]   { --felt: #4b2a7a; --felt2: #2c1648; }
body[data-back="gold"]  { --back1: #c99a3b; --back2: #8a6420; }
body[data-back="ink"]   { --back1: #1d2430; --back2: #0a0e14; }
body[data-back="neon"]  { --back1: #0fb5a0; --back2: #0a6f8a; }
body[data-dealer="marco"] { --d-skin: #c68c5a; --d-hair: #111; --d-vest: #14416b; --d-tie: #f6f0e2; }
body[data-dealer="nova"]  { --d-skin: #8d5b3a; --d-hair: #6a1fb0; --d-vest: #1a1a22; --d-tie: #4fe0a0; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--ink); color: var(--paper); font-family: var(--ui); font-size: 15px; line-height: 1.4; overflow-x: hidden; }
button { font-family: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#app { min-height: 100%; display: flex; flex-direction: column; background:
  radial-gradient(120% 80% at 50% 30%, var(--felt) 0%, var(--felt2) 70%, #06130d 100%); position: relative; }
#app::before { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px); background-size: 6px 6px; }
.hud { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; position: relative; z-index: 2; }
.bank { display: flex; align-items: center; gap: 8px; background: var(--glass); border: 1px solid var(--gold2); border-radius: 999px; padding: 5px 6px 5px 10px; font-weight: 800; color: var(--gold); cursor: pointer; }
.bank .coin, .coin { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3c4, var(--gold) 45%, var(--gold2)); border: 2px dashed rgba(90,55,10,.55); display: inline-block; flex: none; }
.bank .plus { width: 22px; height: 22px; border-radius: 50%; background: var(--gold); color: #3a2a08; display: grid; place-items: center; font-weight: 900; line-height: 1; }
.hud .sp { flex: 1; }
.iconbtn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid rgba(255,255,255,.18); background: var(--glass); display: grid; place-items: center; cursor: pointer; font-size: 18px; }
.target { position: relative; width: 56px; height: 56px; display: grid; place-items: center; }
.ring { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--gold), var(--hot), var(--gold));
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); }
.ring.twist { animation: spin .9s cubic-bezier(.2,.8,.2,1); }
@keyframes spin { from { transform: rotate(-360deg) scale(.8); } to { transform: none; } }
.target b { font-family: var(--display); font-size: 22px; font-weight: 900; }
.target small { position: absolute; bottom: -2px; font-size: 8px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

.dealer { display: flex; align-items: flex-end; gap: 10px; padding: 0 14px; position: relative; z-index: 2; }
.dealer svg.face { width: 86px; height: 86px; flex: none; filter: drop-shadow(0 6px 8px rgba(0,0,0,.5)); }
.bubble { position: relative; background: var(--paper); color: var(--paper-ink); border-radius: 14px 14px 14px 4px; padding: 8px 12px; font-size: 14px; font-weight: 600; max-width: 220px; margin-bottom: 18px; box-shadow: 0 4px 10px rgba(0,0,0,.35); animation: pop .25s ease-out; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
.shoe { margin-left: auto; margin-bottom: 14px; position: relative; width: 52px; height: 70px; }
.shoe i { position: absolute; inset: 0; border-radius: 8px; background: repeating-conic-gradient(from 0deg, var(--back1) 0 15deg, var(--back2) 15deg 30deg); border: 2px solid var(--paper); box-shadow: 0 2px 0 rgba(0,0,0,.4); }
.shoe i:nth-child(1) { transform: translate(-4px,-4px); } .shoe i:nth-child(2) { transform: translate(-2px,-2px); }
.shoe b { position: absolute; left: 0; right: 0; bottom: -16px; text-align: center; font-size: 10px; color: var(--muted); font-weight: 700; }
.railtop { height: 10px; margin: 0 8px; border-radius: 6px 6px 0 0; background: linear-gradient(var(--rail2), var(--rail)); position: relative; z-index: 2; border: 1px solid #000; }

main.table { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 10px 12px 14px; border: 6px solid transparent; border-image: linear-gradient(var(--rail2), var(--rail)) 1; border-top: 0; margin: 0 6px; border-radius: 0 0 18px 18px; background: linear-gradient(rgba(0,0,0,.08), rgba(0,0,0,.22)); box-shadow: inset 0 0 40px rgba(0,0,0,.45); }
.opps { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seat { background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.14); border-radius: 14px; padding: 8px 8px 10px; transition: border-color .2s, box-shadow .2s; }
.seat.is-turn { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(232,196,106,.22); }
.seat-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.avatar { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 12px; color: #1a1208; flex: none; }
.seat-head h2 { font-size: 13px; font-weight: 800; margin: 0; }
.seat-total { margin-left: auto; font-family: var(--display); font-weight: 900; font-size: 18px; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { font-size: 9px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: rgba(255,255,255,.14); }
.chip.turn { background: var(--gold); color: #2b1d00; } .chip.bust { background: var(--rose); color: #2b0510; } .chip.shield { background: var(--mint); color: #05271a; } .chip.skip { background: var(--hot); color: #2b0c05; } .chip.win { background: var(--gold); color: #2b1d00; }
.cards { display: flex; flex-wrap: wrap; gap: 5px; min-height: var(--ch); }
.is-bust .cards { opacity: .5; }
.amini { display: flex; align-items: center; gap: 6px; margin-top: 7px; color: var(--muted); font-size: 11px; }
.apips { display: inline-flex; gap: 3px; } .apip { width: 11px; height: 16px; border-radius: 3px; background: var(--hot); display: block; transform: rotate(-6deg); }
.card { width: var(--cw); height: var(--ch); border-radius: 7px; position: relative; overflow: hidden; display: grid; place-items: center; flex: none; font-family: var(--display); box-shadow: 0 2px 0 rgba(0,0,0,.4), 0 8px 14px -8px rgba(0,0,0,.8); }
.card.num { background: var(--paper); color: var(--paper-ink); }
.card.num b { font-weight: 900; font-size: calc(var(--cw) * .56); }
.card.num::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 6px; background: var(--band); }
.card.lo { --band: var(--lo); } .card.mid { --band: var(--mid); } .card.hi { --band: var(--hi); }
.card i { position: absolute; left: 4px; top: 9px; font-style: normal; font-size: 10px; font-weight: 800; opacity: .6; }
.card.back { background: repeating-conic-gradient(from 0deg, var(--back1) 0 15deg, var(--back2) 15deg 30deg); border: 2px solid var(--paper); }
.card.back b { color: var(--gold); font-size: calc(var(--cw) * .34); background: rgba(0,0,0,.55); width: 62%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; }
.card.peeked { outline: 3px dashed var(--gold); outline-offset: -3px; } .card.mine { outline: 2px dashed rgba(255,255,255,.5); outline-offset: -3px; }
.deal { animation: deal .42s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d, 0ms); }
.flip { animation: flip .45s ease-out both; }
@keyframes deal { from { transform: translate(40px,-150px) rotate(-18deg) scale(.5); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes flip { from { transform: rotateY(90deg); } to { transform: none; } }

.mid { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; }
.pips { display: inline-flex; gap: 3px; } .pips i { width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--muted); display: block; } .pips i.on { background: var(--gold); border-color: var(--gold); }
.sc { display: inline-flex; align-items: center; gap: 6px; background: var(--glass); border-radius: 999px; padding: 3px 10px; font-weight: 700; font-size: 12px; color: var(--paper); }
.sc.me { border: 1px solid var(--gold); }
.feedbox { background: var(--glass); border-radius: 10px; padding: 7px 10px; min-height: 40px; }
#status { margin: 0; font-weight: 800; font-size: 13px; } .feed { list-style: none; margin: 2px 0 0; padding: 0; color: var(--muted); font-size: 12px; }
.you { display: flex; flex-direction: column; gap: 10px; }
.you .card { --cw: 54px; --ch: 76px; }
.hand { display: flex; gap: 8px; }
.empty { margin: 0; color: var(--muted); font-size: 12px; padding: 6px 2px; }
.acard { flex: 1 1 0; min-width: 0; min-height: 104px; text-align: left; cursor: pointer; background: linear-gradient(160deg, #f0693a, #c8421b); color: #260a02; border: 0; border-radius: 12px; padding: 9px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 2px 0 rgba(0,0,0,.4), 0 10px 16px -10px rgba(0,0,0,.8); transition: transform .15s; }
.acard svg { width: 22px; height: 22px; flex: none; } .acard strong { font-weight: 900; font-size: 11px; text-transform: uppercase; } .acard span { font-size: 10.5px; line-height: 1.25; font-weight: 600; }
.acard:disabled { background: #3b2f3d; color: #a99bb0; box-shadow: none; cursor: default; }
.chooser { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--glass); border: 1px dashed var(--gold); border-radius: 12px; padding: 8px 10px; }
.chooser > span { font-weight: 800; }
.pick { background: var(--paper); color: var(--paper-ink); border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 800; cursor: pointer; } .pick small { opacity: .65; margin-left: 4px; } .pick.ghost { background: transparent; color: var(--paper); border: 1px solid rgba(255,255,255,.3); }
.controls { display: flex; gap: 10px; align-items: center; }
.btn { font-family: var(--display); font-weight: 900; font-size: 16px; padding: 13px 22px; border-radius: 14px; border: 2px solid transparent; cursor: pointer; text-align: center; }
.btn.hit { background: linear-gradient(var(--gold), var(--gold2)); color: #2b1d00; flex: 1; } .btn.stand { background: transparent; color: var(--paper); border-color: var(--paper); flex: 1; }
.btn.gold { background: linear-gradient(var(--gold), var(--gold2)); color: #2b1d00; } .btn.ghost { background: transparent; border-color: rgba(255,255,255,.35); color: var(--paper); }
.btn:disabled { opacity: .35; cursor: default; }
.odds { margin: 0; font-size: 12px; color: var(--muted); } .oddsbtn { background: var(--glass); border: 1px solid var(--gold2); color: var(--gold); border-radius: 999px; padding: 6px 10px; font-weight: 800; font-size: 12px; cursor: pointer; white-space: nowrap; }
.oddsbtn:disabled { opacity: .4; }

.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(4,14,9,.86); backdrop-filter: blur(5px); overflow: auto; padding: 14px; display: flex; }
.dialog { margin: auto; width: 100%; max-width: 440px; background: linear-gradient(#143c2b, #0d2a1e); border: 1px solid var(--gold2); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.dialog h2 { font-family: var(--display); font-weight: 900; font-size: 28px; line-height: 1.05; margin: 0; text-wrap: balance; } .dialog p { margin: 0; }
.eyebrow { color: var(--gold); font-weight: 800; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
.sub { color: var(--muted); font-size: 14px; }
.dots { display: flex; gap: 6px; justify-content: center; } .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); } .dots i.on { background: var(--gold); width: 20px; border-radius: 4px; }
.hero { display: grid; place-items: center; padding: 8px 0; }
.bigcard { width: 120px; height: 168px; border-radius: 14px; background: var(--paper); color: var(--paper-ink); display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 72px; position: relative; box-shadow: 0 14px 30px rgba(0,0,0,.5); transform: rotate(-6deg); }
.bigcard::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 12px; background: var(--gold); border-radius: 14px 14px 0 0; }
.iconrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.iconrow div { background: linear-gradient(160deg, #f0693a, #c8421b); color: #260a02; border-radius: 12px; padding: 10px 6px; text-align: center; font-weight: 900; font-size: 11px; text-transform: uppercase; }
.iconrow svg { width: 24px; height: 24px; display: block; margin: 0 auto 4px; }
.perks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; } .perks li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.perks .tick { width: 20px; height: 20px; border-radius: 50%; background: var(--mint); color: #05271a; display: grid; place-items: center; font-weight: 900; font-size: 12px; flex: none; margin-top: 1px; }
.rules { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; } th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid rgba(255,255,255,.12); vertical-align: middle; } thead th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--display); font-weight: 900; } .cardtable td.ic { width: 30px; color: var(--hot); } .cardtable svg { width: 20px; height: 20px; display: block; }
.packs { display: flex; flex-direction: column; gap: 8px; }
.pack { display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,.28); border: 1px solid var(--gold2); border-radius: 14px; padding: 10px 12px; cursor: pointer; width: 100%; text-align: left; }
.pack .amt { font-weight: 900; font-size: 18px; color: var(--gold); display: flex; align-items: center; gap: 8px; } .pack .tag { font-size: 10px; font-weight: 800; background: var(--hot); color: #fff; border-radius: 999px; padding: 2px 8px; margin-left: 6px; }
.pack .px { margin-left: auto; font-weight: 900; background: var(--gold); color: #2b1d00; padding: 8px 14px; border-radius: 10px; }
.wgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.wi { background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.16); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 6px; align-items: center; cursor: pointer; font-weight: 800; font-size: 12px; text-align: center; }

.legal { color: var(--muted); font-size: 12px; margin: 0; } .legal a { color: var(--gold); font-weight: 700; }
.gain { color: var(--gold); font-weight: 900; }
.menu { display: flex; flex-direction: column; gap: 8px; } .menu .btn { text-align: left; font-size: 15px; display: flex; align-items: center; gap: 10px; }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 13px; padding: 6px; }
@media (min-width: 700px) { #app { max-width: 520px; margin: 0 auto; } }
@media (prefers-reduced-motion: reduce) { .deal, .flip, .ring.twist, .bubble, .toast { animation: none; } }
</style>

    var fresh = !S.seen.has(c.id), deal = fresh ? ' deal' : '';
    var st = fresh ? ' style="--d:' + (dealN++ * 120) + 'ms"' : '';
    if (o.down) return '<div class="card back' + deal + '"' + st + ' role="img" aria-label="Face-down card"><b>21</b></div>';
    var band = c.v <= 3 ? 'lo' : c.v <= 7 ? 'mid' : 'hi';

  }
  function chipsHTML(p, i) {
    var h = '';
    if (p.bust) h += '<span class="chip bust">Bust</span>'; else if (p.stood) h += '<span class="chip">Standing</span>';
    if (p.shield) h += '<span class="chip shield">Shield</span>';
    if (p.skip) h += '<span class="chip skip">Skipped</span>';
    if (S.phase === 'play' && !S.roundEnded && S.cur === i && active(p)) h += '<span class="chip turn">' + (p.human ? 'Your turn' : 'Playing') + '</span>';
    return h;
  }
  var AV = ['#e8c46a', '#7fd1c4', '#f29bb0'];
  function seatHTML(p, i) {
    var me = S.players[0];
    var reveal = S.roundEnded || p.human || me.peeked.has(i);
    var cards = p.cards.map(function (c, ci) {
      return cardHTML(c, { down: ci === 0 && !reveal, flip: ci === 0 && S.roundEnded && !S.flipped && !p.human, peeked: ci === 0 && !p.human && !S.roundEnded && me.peeked.has(i), mine: ci === 0 && p.human });
    }).join('');
    var totalTxt = reveal ? String(total(p)) : visTotal(p) + '+?';
    var turn = S.phase === 'play' && !S.roundEnded && S.cur === i && active(p);
    var h = '<section class="seat' + (turn ? ' is-turn' : '') + (p.bust ? ' is-bust' : '') + '" aria-label="' + p.name + '">';

    h += '<div class="cards">' + cards + '</div>';
    if (!p.human) {
      var pips = ''; for (var k = 0; k < p.actions.length; k++) pips += '<span class="apip"></span>';

    }
    return h + '</section>';
  }
  function handHTML(me) {
    var canAct = S.humanTurn && !S.acted && !S.pending;
    var h = '<div class="hand" role="group" aria-label="Your action cards">';
    if (!me.actions.length) h += '<p class="empty">No action cards. Drawing one counts as your hit.</p>';
    me.actions.forEach(function (a) {
      var ok = canAct && valid(me, a.k), A = ACTIONS[a.k];
      h += '<button class="acard" data-act="card" data-k="' + a.k + '"' + (ok ? '' : ' disabled') + '>' + icon(a.k) + '<strong>' + A.name + '</strong><span>' + A.desc + '</span></button>';
    });
    return h + '</div>';
  }
  function statusText() {
    if (S.phase === 'intro') return 'Ready when you are.';
    if (S.roundEnded) return 'Cards revealed.';
    if (S.pending) return 'Pick a target for ' + ACTIONS[S.pending.k].name + '.';
    if (S.humanTurn) return S.acted ? 'Action played. Now Hit or Stand.' : 'Your turn. Play an action card if you like, then Hit or Stand.';
    var p = S.players[S.cur]; return p && !p.human ? p.name + ' is playing…' : '';
  }
  function controlsHTML(me) {
    var h = '';
    if (S.pending) {
      var ts = targetsFor(me, S.pending.k) || [];
      h += '<div class="chooser" role="group" aria-label="Choose a target"><span>' + ACTIONS[S.pending.k].name + ' on:</span>';
      ts.forEach(function (o) { var i = idxOf(o); var info = (S.roundEnded || me.peeked.has(i)) ? total(o) : visTotal(o) + '+?'; h += '<button class="pick" data-act="target" data-t="' + i + '">' + o.name + ' <small>' + info + '</small></button>'; });
      h += '<button class="pick ghost" data-act="cancel">Cancel</button></div>';
    }
    var on = S.humanTurn && !S.pending;
    var odds = S.oddsOn && on ? (total(me) >= S.target ? 'Already on target.' : 'Bust chance if you hit: about ' + bustRisk(me) + '%') : '';
    h += '<div class="controls"><button class="btn hit" data-act="hit"' + (on ? '' : ' disabled') + '>Hit</button><button class="btn stand" data-act="stand"' + (on ? '' : ' disabled') + '>Stand</button>' +
      '<button class="oddsbtn" data-act="odds"' + (on && !S.oddsOn ? '' : ' disabled') + '>Odds · ' + ODDS_COST + '</button></div>';
    if (odds) h += '<p class="odds">' + odds + '</p>';
    return h;
  }

  function legalHTML() {
    function a(url, label) { return '<a href="' + url + '" target="_blank" rel="noopener" data-act="link" data-url="' + url + '">' + label + '</a>'; }
    return '<p class="legal">' + a(TERMS_URL, 'Terms of Use (Apple Standard EULA)') + ' · ' + a(PRIVACY_URL, 'Privacy Policy') + ' · ' + a(SUPPORT_URL, 'Support') + '</p>';
  }
  function dlg(inner) { return '<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="ovt"><div class="dialog">' + inner + '</div></div>'; }
  function tick(t) { return '<li><span class="tick">✓</span><span>' + t + '</span></li>'; }

  function rulesBody() {
    var rows = ORDER.map(function (k) { return '<tr><td class="ic">' + icon(k) + '</td><th scope="row">' + ACTIONS[k].name + '</th><td>' + ACTIONS[k].desc + '</td></tr>'; }).join('');
    return '<ul class="rules"><li>Finish a round closest to the target, <strong>21</strong>, without going over. Number cards run 1 to 10.</li>' +
      '<li>Each turn, play <strong>one</strong> action card if you want, then <strong>Hit</strong> or <strong>Stand</strong>.</li>' +
      '<li>Your first card is face-down to the others. Everything else is face-up.</li>' +
      '<li>Drawing an action card puts it in your hand (limit 3) and ends your turn. You start each round with one.</li>' +
      '<li>Win a round for 1 point, or 2 on the exact target. First to ' + WIN_POINTS + ' wins the match. Ties score nothing.</li></ul>' +
      '<table class="cardtable"><tbody>' + rows + '</tbody></table>';
  }

  var ONB = [
    { eye: 'Welcome', h: 'Blackjack, but you can bend the rules', p: 'Get closest to 21 without going over, against Ava and Rex. Then play action cards to change everything.', hero: '<div class="bigcard">21</div>' },
    { eye: 'Nine action cards', h: 'Skip, swap, peek, shield, twist the target', p: 'One action card per turn, then Hit or Stand. Move the target to 18 or 24 and watch the table scramble.', hero: '<div class="iconrow">' + ['skip', 'swap', 'peek', 'shield', 'lower', 'raise'].map(function (k) { return '<div>' + icon(k) + ACTIONS[k].name + '</div>'; }).join('') + '</div>' },
    { eye: 'Win it', h: 'First to 5 points wins the match', p: 'A round win is 1 point, or 2 for landing exactly on target. Earn chips on every round and spend them on looks.', hero: '<div class="iconrow"><div style="background:#e8c46a">1 pt<br>round win</div><div style="background:#e8c46a">2 pts<br>exact hit</div><div style="background:#e8c46a">5 pts<br>match</div></div>' }
  ];
  function onboardingHTML() {
    var s = S.onb;
    if (s < ONB.length) {

      tick('<strong>All 9 action cards</strong> and unlimited matches') + tick('<strong>10,000 chips</strong> to start, plus a daily bonus') +
      tick('<strong>Earn chips</strong> on every round you play') + tick('<strong>Unlock looks</strong>: felts, card backs and dealers') +
      tick('<strong>Odds meter</strong> when you want a hint') + tick('No ads. No subscription.') + '</ul>' +
      '<p class="sub">Need more chips? Optional chip packs are one-time purchases and never required to play.</p>' + legalHTML() +
      '<button id="primary" class="btn gold" data-act="onbdone">Deal me in</button><button class="btn ghost" data-act="shop">See chip packs</button>');
  }
  function homeHTML() {
    var d = dailyReady();
    return dlg('<p class="eyebrow">Blackjack with action cards</p><h2 id="ovt">Twist 21</h2><p class="sub">You against Ava and Rex. First to ' + WIN_POINTS + ' points.</p>' +
      (d ? '<button class="btn ghost" data-act="daily">Claim daily bonus · +' + fmt(dailyAmount().amount) + '</button>' : '') +
      '<button id="primary" class="btn gold" data-act="start">Deal me in</button>' +
      '<div class="menu"><button class="btn ghost" data-act="wardrobe">Wardrobe</button><button class="btn ghost" data-act="rulesopen">How to play</button></div>' + legalHTML());
  }
  function resultHTML() {

      '<table><thead><tr><th>Player</th><th>Cards</th><th class="num">Total</th><th>Result</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '<p class="sub">Score (first to ' + WIN_POINTS + '): ' + score + '</p><button id="primary" class="btn gold" data-act="' + (final ? 'newmatch' : 'next') + '">' + (final ? 'New match' : 'Next round') + '</button>');

  function shopHTML() {

    var note = inApp() ? (S.storeReady ? '' : '<p class="sub">Loading App Store prices…</p>') : '<p class="sub">Preview: packs add chips for free here. In the iOS app they are one-time App Store purchases.</p>';
    return dlg('<p class="eyebrow">Chip shop</p><h2 id="ovt">Get more chips</h2><p class="sub">You have <strong class="gain">' + fmt(SAVE.bank) + '</strong> chips. Chips unlock looks and the odds meter. You never need them to play. One-time purchases, no subscription.</p>' + note +

  }
  function wardrobeHTML() {
    function sect(kind, title) {
      return '<p class="eyebrow">' + title + '</p><div class="wgrid">' + CATALOG[kind].map(function (it) {
        var own = SAVE.owned[kind].indexOf(it.id) >= 0, on = SAVE.eq[kind] === it.id;
        return '<button class="wi' + (on ? ' on' : '') + '" data-act="item" data-k="' + kind + '" data-id="' + it.id + '"><span class="sw" style="background:' + it.sw + '"></span>' + it.name + '<small>' + (on ? 'In use' : own ? 'Tap to use' : fmt(it.cost) + ' chips') + '</small></button>';

    return dlg('<p class="eyebrow">Wardrobe</p><h2 id="ovt">Make the table yours</h2><p class="sub">Chips: <strong class="gain">' + fmt(SAVE.bank) + '</strong></p>' + sect('felt', 'Table felt') + sect('back', 'Card backs') + sect('dealer', 'Dealer') +
      '<button class="btn ghost" data-act="shop">Get chips</button><button class="btn stand" data-act="close">Back</button>');
  }
  function statsHTML() {
    var s = SAVE.stats;
    function r(a, b) { return '<tr><th scope="row">' + a + '</th><td class="num">' + b + '</td></tr>'; }
    return dlg('<p class="eyebrow">Your record</p><h2 id="ovt">Stats</h2><table><tbody>' + r('Matches played', s.matches) + r('Matches won', s.wins) + r('Win streak (best)', s.streak + ' (' + s.best + ')') + r('Rounds played', s.rounds) + r('Rounds won', s.roundWins) + r('Chips earned playing', fmt(s.earned)) + '</tbody></table><button class="btn stand" data-act="close">Back</button>');
  }
  function menuHTML() {
    return dlg('<p class="eyebrow">Menu</p><h2 id="ovt">Twist 21</h2><div class="menu"><button class="btn ghost" data-act="shop">Chip shop</button><button class="btn ghost" data-act="wardrobe">Wardrobe</button><button class="btn ghost" data-act="stats">Stats</button><button class="btn ghost" data-act="rulesopen">How to play</button>' +
      (dailyReady() ? '<button class="btn gold" data-act="daily">Daily bonus · +' + fmt(dailyAmount().amount) + '</button>' : '') + '</div>' + legalHTML() + '<button class="btn stand" data-act="close">Back to the table</button>');
  }
  function rulesHTML() { return dlg('<p class="eyebrow">How to play</p><h2 id="ovt">Twist 21 rules</h2>' + rulesBody() + legalHTML() + '<button id="primary" class="btn stand" data-act="close">Back</button>'); }

  function overlayHTML() {

    if (S.screen === 'stats') return statsHTML();

    if (S.screen === 'rules') return rulesHTML();
    if (!SAVE.onboarded) return onboardingHTML();
    if (S.phase === 'intro') return homeHTML();
    if (S.phase === 'roundEnd' || S.phase === 'matchEnd') return resultHTML();
    return '';
  }

  function render() {
    var me = S.players[0];
    dealN = 0;
    var oppsHTML = S.players.map(function (p, i) { return i ? seatHTML(p, i) : ''; }).join('');
    var youHTML = seatHTML(me, 0) + handHTML(me) + controlsHTML(me);
    var feed = S.log.slice(-3).map(function (m) { return '<li>' + m + '</li>'; }).join('');
    var order = S.dir === 1 ? 'You → Ava → Rex' : 'You → Rex → Ava';
    var score = S.players.map(function (p) {
      var pips = ''; for (var i = 0; i < WIN_POINTS; i++) pips += '<i class="' + (i < p.points ? 'on' : '') + '"></i>';
      return '<span class="sc' + (p.human ? ' me' : '') + '">' + p.name.charAt(0) + '<span class="pips" aria-label="' + p.points + ' points">' + pips + '</span></span> ';
    }).join('');
    var overlay = overlayHTML();
    if (!hasDom) return;
    $('#opps').innerHTML = oppsHTML; $('#you').innerHTML = youHTML; $('#feed').innerHTML = feed; $('#status').textContent = statusText();
    $('#score').innerHTML = score; $('#meta').textContent = 'Round ' + S.round + ' · ' + order; $('#bankn').textContent = fmt(SAVE.bank);
    $('#deckn').textContent = S.deck.length + ' left';
    var sy = $('#say'); if (S.say && sy.textContent !== S.say) { sy.textContent = S.say; sy.style.animation = 'none'; void sy.offsetWidth; sy.style.animation = ''; }
    var tn = $('#tnum');
    if (tn.textContent !== String(S.target)) { tn.textContent = S.target; var ring = $('#ring'); ring.classList.remove('twist'); void ring.offsetWidth; ring.classList.add('twist'); if (S.target !== 21) say('twist'); }
    if (overlay !== S.lastOverlay) { $('#overlay').innerHTML = overlay; S.lastOverlay = overlay; }
    var key = S.screen || (!SAVE.onboarded ? 'onb' + S.onb : S.phase);
    if (overlay && S.overlayKey !== key) { var pb = $('#primary'); if (pb) pb.focus(); }
    S.overlayKey = overlay ? key : '';

    if (S.roundEnded) S.flipped = true;
  }

  // ---------- events ----------
  function onClick(e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var a = el.dataset.act, me = S.players[0];
    if (a === 'link') { if (inApp()) { e.preventDefault(); toApp('link', { url: el.dataset.url }); } return; }
    if (a === 'card') {
      var k = el.dataset.k; if (!S.humanTurn || S.acted || !valid(me, k)) return;
      if (targetsFor(me, k)) { S.pending = { k: k }; render(); } else playHuman(k);
    } else if (a === 'target') { if (S.pending) playHuman(S.pending.k, +el.dataset.t); }
    else if (a === 'cancel') { S.pending = null; render(); }
    else if (a === 'hit') { humanHit(); }
    else if (a === 'stand') { humanStand(); }
    else if (a === 'odds') { useOdds(); render(); }
    else if (a === 'start') { say('start'); beginRound(); }
    else if (a === 'next') { say('start'); nextRound(); }
    else if (a === 'newmatch') { say('start'); initMatch(); beginRound(); }
    else if (a === 'menu') { S.screen = 'menu'; render(); }
    else if (a === 'rulesopen') { S.screen = 'rules'; render(); }
    else if (a === 'shop') { S.screen = 'shop'; render(); }
    else if (a === 'wardrobe') { S.screen = 'wardrobe'; render(); }
    else if (a === 'stats') { S.screen = 'stats'; render(); }
    else if (a === 'close') { S.screen = null; render(); }
    else if (a === 'daily') { claimDaily(); render(); }
    else if (a === 'item') { buyItem(el.dataset.k, el.dataset.id); render(); }
    else if (a === 'onbnext') { S.onb++; render(); }
    else if (a === 'onbskip') { S.onb = ONB.length; render(); }
    else if (a === 'onbdone') { SAVE.onboarded = true; persist(); if (dailyReady()) claimDaily(); render(); }
    else if (a === 'buy') {
      var id = el.dataset.id;
      if (inApp()) toApp('buy', { id: id }); else { grantPack(id); }
    }
    else if (a === 'restore') { if (inApp()) toApp('restore'); else toast('Nothing to restore in the preview'); }
  }
  function grantPack(id) {
    var p = PACKS.filter(function (x) { return x.id === id; })[0]; if (!p) return false;
    gain(p.chips, 'buy'); toast('+' + fmt(p.chips) + ' chips added'); render(); return true;
  }
  // The Expo app calls these.
  function setOffers(list) { S.offers = {}; (list || []).forEach(function (o) { S.offers[o.id] = o; }); S.storeReady = !!(list && list.length); render(); }
  function setStoreReady(on) { S.storeReady = !!on; render(); }
  function notify(msg) { toast(String(msg)); }

  if (hasDom) {
    loadSave(); applyLook();
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.screen) { S.screen = null; render(); } });
    initMatch();
  }

  var api = { S: S, SAVE: SAVE, PACKS: PACKS, CATALOG: CATALOG, REWARD: REWARD, grantPack: grantPack, setOffers: setOffers, setStoreReady: setStoreReady, notify: notify, initMatch: initMatch, beginRound: beginRound, nextRound: nextRound, total: total, ACTIONS: ACTIONS, ORDER: ORDER, WIN_POINTS: WIN_POINTS, render: render, buyItem: buyItem, claimDaily: claimDaily, dailyReady: dailyReady, loadSave: loadSave };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else if (typeof window !== 'undefined') window.T21 = api;
})();
</script>
