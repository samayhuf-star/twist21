<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twist 21</title>
<style>
/* Layout idea: a night-blue card table, three seats, one ring that spins when the target changes. */
:root {
  --ink: #100e26;
  --table: #1a1840;
  --edge: #2f2c66;
  --paper: #f3eee4;
  --paper-ink: #17152e;
  --hot: #ff5a3c;
  --twist: #ffd23f;
  --mint: #3ddc97;
  --rose: #ff4d6d;
  --muted: #a29fd0;
  --lo: #59c9d6;
  --mid: #b9a6ff;
  --hi: #ff8fa3;
  --display: -apple-system, 'Arial Black', system-ui, sans-serif;
  --body: -apple-system, 'SF Pro Rounded', system-ui, 'Segoe UI', sans-serif;
  --cw: 58px;
  --ch: 84px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: radial-gradient(1200px 600px at 50% -10%, #2a2670 0%, transparent 60%), var(--ink);
  color: var(--paper);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  min-height: 100%;
}
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--twist); outline-offset: 2px; }

.wrap { max-width: 1000px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }

/* header */
.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand h1 { font-family: var(--display); font-weight: 900; font-size: clamp(28px, 6vw, 44px); line-height: 1; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
.brand h1 em { font-style: normal; color: var(--twist); }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.target { position: relative; width: 88px; height: 88px; margin-left: auto; display: grid; place-items: center; }
.ring {
  position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 0deg, var(--twist), var(--hot), var(--twist));
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
}
.ring.twist { animation: spin 0.9s cubic-bezier(.2, .8, .2, 1); }
@keyframes spin { from { transform: rotate(-360deg) scale(.8); } to { transform: none; } }
.target b { font-family: var(--display); font-weight: 900; font-size: 30px; font-variant-numeric: tabular-nums; }
.target small { position: absolute; bottom: 14px; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.link { background: none; border: 1px solid var(--edge); color: var(--paper); border-radius: 999px; padding: 9px 16px; font-weight: 700; font-size: 14px; cursor: pointer; }
.link:hover { border-color: var(--twist); }

/* scoreboard */
.bar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; justify-content: space-between; }
.scores { display: flex; gap: 8px; flex-wrap: wrap; }
.sc { display: flex; align-items: center; gap: 10px; background: var(--table); border: 1px solid var(--edge); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 14px; }
.sc.me { border-color: var(--twist); }
.pips { display: inline-flex; gap: 4px; }
.pips i { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--muted); display: block; }
.pips i.on { background: var(--twist); border-color: var(--twist); }
#meta { color: var(--muted); font-size: 13px; }

/* seats */
.opps { display: grid; grid-template-columns: 1fr; gap: 12px; }
.seat { background: var(--table); border: 1px solid var(--edge); border-radius: 16px; padding: 14px; transition: border-color .2s, box-shadow .2s; }
.seat.is-turn { border-color: var(--twist); box-shadow: 0 0 0 4px rgba(255, 210, 63, .16); }
.seat-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.seat-head h2 { font-family: var(--display); font-weight: 700; font-size: 15px; margin: 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.seat-total { margin-left: auto; font-family: var(--display); font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
.chip { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--edge); color: var(--paper); }
.chip.turn { background: var(--twist); color: #1b1700; }
.chip.bust { background: var(--rose); color: #2b0510; }
.chip.shield { background: var(--mint); color: #05271a; }
.chip.skip { background: var(--hot); color: #2b0c05; }
.chip.win { background: var(--twist); color: #1b1700; }
.chip.stood { background: var(--edge); color: var(--muted); }
.cards { display: flex; flex-wrap: wrap; gap: 8px; min-height: var(--ch); }
.is-bust .cards { opacity: .5; }
.amini { display: flex; align-items: center; gap: 10px; margin-top: 10px; color: var(--muted); font-size: 13px; }
.apips { display: inline-flex; gap: 4px; }
.apip { width: 14px; height: 20px; border-radius: 3px; background: var(--hot); display: block; transform: rotate(-6deg); }
.apip:nth-child(2) { transform: rotate(0); } .apip:nth-child(3) { transform: rotate(6deg); }

/* cards */
.card {
  width: var(--cw); height: var(--ch); border-radius: 9px; position: relative; overflow: hidden;
  display: grid; place-items: center; flex: none;
  box-shadow: 0 2px 0 rgba(0, 0, 0, .4), 0 10px 18px -10px rgba(0, 0, 0, .8);
  font-family: var(--display);
}
.card.num { background: var(--paper); color: var(--paper-ink); }
.card.num b { font-weight: 900; font-size: calc(var(--cw) * .52); font-variant-numeric: tabular-nums; }
.card.num::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 7px; background: var(--band); }
.card.lo { --band: var(--lo); } .card.mid { --band: var(--mid); } .card.hi { --band: var(--hi); }
.card i { position: absolute; left: 5px; top: 10px; font-style: normal; font-size: 11px; font-weight: 800; opacity: .6; }
.card.back {
  background: repeating-conic-gradient(from 0deg, #2c2966 0 15deg, #221f55 15deg 30deg);
  border: 2px solid var(--paper);
}
.card.back b { color: var(--twist); font-weight: 900; font-size: calc(var(--cw) * .36); background: var(--ink); width: 60%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; }
.card.peeked { outline: 3px dashed var(--twist); outline-offset: -3px; }
.card.mine { outline: 2px dashed var(--muted); outline-offset: -3px; }
.deal { animation: deal .35s ease-out both; }
.flip { animation: flip .45s ease-out both; }
@keyframes deal { from { transform: translateY(-22px) rotate(-7deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes flip { from { transform: rotateY(90deg); } to { transform: none; } }

/* your side */
.you { display: flex; flex-direction: column; gap: 12px; }
.hand { display: flex; flex-wrap: wrap; gap: 10px; }
.empty { margin: 0; color: var(--muted); font-size: 14px; padding: 8px 2px; }
.acard {
  flex: 1 1 104px; max-width: 150px; min-height: 140px; text-align: left; cursor: pointer;
  background: var(--hot); color: #240a04; border: 0; border-radius: 12px; padding: 12px;
  display: flex; flex-direction: column; gap: 6px;
  box-shadow: 0 2px 0 rgba(0, 0, 0, .4), 0 12px 20px -12px rgba(0, 0, 0, .8);
  transition: transform .15s;
}
.acard svg { width: 26px; height: 26px; flex: none; }
.acard strong { font-family: var(--display); font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: .02em; }
.acard span { font-size: 12px; line-height: 1.3; font-weight: 500; }
.acard:not(:disabled):hover { transform: translateY(-4px); }
.acard:disabled { background: #4a2a52; color: #b9a8c4; cursor: not-allowed; box-shadow: none; }
.chooser { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--table); border: 1px dashed var(--twist); border-radius: 12px; padding: 10px 12px; }
.chooser > span { font-weight: 800; margin-right: 4px; }
.pick { background: var(--paper); color: var(--paper-ink); border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 800; cursor: pointer; }
.pick small { font-weight: 600; opacity: .7; margin-left: 4px; }
.pick.ghost { background: transparent; color: var(--paper); border: 1px solid var(--edge); }
.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn { font-family: var(--display); font-weight: 800; font-size: 15px; padding: 14px 28px; border-radius: 12px; border: 2px solid transparent; cursor: pointer; letter-spacing: .01em; }
.btn.hit { background: var(--twist); color: #1b1700; }
.btn.stand { background: transparent; color: var(--paper); border-color: var(--paper); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn:not(:disabled):hover { filter: brightness(1.08); }
.risk { margin: 0; color: var(--muted); font-size: 14px; }

/* feed */
.feedbox { background: rgba(0, 0, 0, .25); border-radius: 12px; padding: 10px 14px; }
#status { margin: 0 0 6px; font-weight: 800; }
.feed { list-style: none; margin: 0; padding: 0; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 2px; }
.feed li.new { color: var(--paper); }

/* overlay */
.overlay { position: fixed; inset: 0; z-index: 10; background: rgba(10, 8, 30, .82); backdrop-filter: blur(4px); overflow: auto; padding: 16px; display: flex; }
.dialog { margin: auto; width: 100%; max-width: 580px; background: var(--table); border: 1px solid var(--edge); border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
.dialog h2 { font-family: var(--display); font-weight: 900; font-size: clamp(26px, 6vw, 36px); line-height: 1.05; margin: 0; text-wrap: balance; }
.dialog p { margin: 0; }
.eyebrow { color: var(--twist); font-weight: 800; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.dialog .btn { align-self: flex-start; margin-top: 4px; }
.rules { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--edge); vertical-align: middle; }
thead th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--display); font-weight: 800; }
.cardtable td.ic { width: 36px; color: var(--hot); }
.cardtable svg { width: 22px; height: 22px; display: block; }
.score { color: var(--muted); font-size: 14px; }

@media (min-width: 700px) {
  :root { --cw: 68px; --ch: 98px; }
  .opps { grid-template-columns: 1fr 1fr; }
  .wrap { padding: 24px; gap: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  .deal, .flip, .ring.twist { animation: none; }
  .acard { transition: none; }
}

/* paywall */
.link.gold { border-color: var(--twist); color: var(--twist); }
.link.gold:disabled { border-color: var(--edge); color: var(--muted); cursor: default; }
.chip.prem { background: var(--twist); color: #1b1700; margin-left: 6px; vertical-align: 1px; }
.risk-lock { background: none; border: 0; padding: 0; color: var(--muted); font-size: 14px; text-decoration: underline dotted; cursor: pointer; }
.risk-lock:hover { color: var(--twist); }
.perks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.perks li { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; }
.perks svg { width: 22px; height: 22px; flex: none; color: var(--hot); margin-top: 1px; }
.perks li:last-child svg { color: var(--mint); }
.priceamount { font-family: var(--display); font-weight: 900; font-size: 52px; line-height: 1; margin: 0; letter-spacing: -0.03em; }
.pricenote { margin: 6px 0 0; font-weight: 700; }
.legalhead { margin: 4px 0 0; color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.unavailable { margin: 0; color: var(--muted); }
a.btn { text-decoration: none; display: inline-block; }
.codebox { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--edge); padding-top: 12px; }
.codebox label { font-weight: 700; font-size: 14px; }
.coderow { display: flex; gap: 8px; flex-wrap: wrap; }
.coderow input { flex: 1 1 180px; min-width: 0; background: var(--ink); color: var(--paper); border: 1px solid var(--edge); border-radius: 10px; padding: 12px 14px; font: 700 16px var(--body); letter-spacing: .08em; text-transform: uppercase; }
.coderow .btn { padding: 12px 20px; font-size: 14px; margin: 0; }
.codemsg { min-height: 1.4em; color: var(--rose); font-size: 14px; }
.dialog > .link { align-self: flex-start; }

.legal { color: var(--muted); font-size: 13px; margin: 0; }
.legal a { color: var(--twist); font-weight: 700; }

/* v2: one-screen table. Play never scrolls; Hit and Stand are pinned at the bottom. */
html, body { height: 100%; overflow: hidden; }
.wrap { height: 100dvh; max-height: 100dvh; padding: 10px 12px 12px; gap: 8px; overflow: hidden; }
.top { gap: 8px; flex-wrap: nowrap; }
.brand h1 { font-size: 26px; }
.link { padding: 7px 13px; font-size: 13px; }
.target { width: 54px; height: 54px; margin-left: auto; flex: none; }
.ring { -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); }
.target b { font-size: 20px; }
.target small { display: none; }
.bar { min-height: 0; }
#meta { font-size: 12px; }
main { flex: none; }
.opps { grid-template-columns: 1fr 1fr; gap: 8px; --cw: 36px; --ch: 52px; }
.opps .card i { display: none; }
.opps .card.num b { font-size: 20px; }
.opps .card.num::before { height: 5px; }
.opps .card { border-radius: 7px; }
.opps .seat { padding: 8px 10px; border-radius: 12px; }
.opps .seat-head { margin-bottom: 6px; gap: 6px; }
.opps .seat-total { font-size: 17px; }
.opps .cards { gap: 5px; min-height: var(--ch); }
.opps .amini { margin-top: 6px; font-size: 11px; }
.seat-head h2 { font-size: 14px; }
.spips { display: inline-flex; gap: 3px; margin-left: 2px; }
.spips i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--muted); display: block; }
.spips i.on { background: var(--twist); border-color: var(--twist); }
.chip { font-size: 10px; padding: 2px 7px; }
.feedbox { padding: 6px 12px; flex: none; }
#status { margin: 0 0 2px; font-size: 14px; }
.feed { font-size: 12px; gap: 0; }
.you { margin-top: auto; gap: 8px; --cw: 48px; --ch: 68px; }
.you .seat { padding: 8px 10px; border-radius: 12px; }
.you .seat-head { margin-bottom: 6px; gap: 6px; }
.you .seat-total { font-size: 20px; }
.you .cards { gap: 6px; min-height: var(--ch); }
.hand { gap: 8px; flex-wrap: nowrap; }
.acard { flex: 1 1 0; max-width: none; min-height: 84px; padding: 8px 9px; gap: 3px; border-radius: 10px; }
.acard svg { width: 20px; height: 20px; }
.acard strong { font-size: 11px; }
.acard span { font-size: 10.5px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.empty { font-size: 13px; padding: 4px 2px; }
.controls { gap: 8px; }
.controls .btn { flex: 1 1 0; padding: 14px 10px; font-size: 16px; }
.risk, .risk-lock { flex: 1 1 100%; font-size: 12px; text-align: center; }
.chooser { padding: 8px 10px; }
@media (min-width: 700px) { .opps { --cw: 44px; --ch: 62px; } .you { --cw: 56px; --ch: 80px; } }


/* ---- v3: chips economy, themes, extras ---- */
.coin { display:inline-block; width:12px; height:12px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #ffe27a, #e0a400); border:2px solid #b87f00; vertical-align:-1px; box-sizing:border-box; }
.chipbtn { display:flex; align-items:center; gap:6px; }
.tip { margin:0; padding:8px 12px; border-radius:12px; background:rgba(255,210,63,.12); border:1px solid rgba(255,210,63,.35); color:var(--paper); font-size:13px; }
.bubble { position:absolute; top:-6px; right:10px; background:var(--paper); color:#1a1840; font-weight:800; font-size:12px; padding:4px 10px; border-radius:12px; z-index:2; animation:pop .2s ease-out; }
.seat { position:relative; }
.shake { animation:shake .4s; }
@keyframes shake { 20%{transform:translateX(-5px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }
@keyframes pop { from{transform:scale(.7);opacity:0} to{transform:scale(1);opacity:1} }
.earn { color:var(--twist); font-weight:800; }
.bonus { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border-radius:14px; background:rgba(255,210,63,.12); border:1px solid rgba(255,210,63,.4); }
.bonus div { display:flex; flex-direction:column; }
.bonus span { color:var(--twist); font-weight:800; }
.bonus .btn { margin:0; align-self:center; padding:10px 18px; }
.menu { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.menu .btn { align-self:stretch; margin:0; }
.tabs { display:flex; gap:6px; }
.tab { flex:1; background:none; border:1px solid var(--edge); color:var(--paper); border-radius:999px; padding:9px; font-weight:700; cursor:pointer; }
.tab.on { background:var(--twist); color:#1b1700; border-color:var(--twist); }
.packs { display:flex; flex-direction:column; gap:6px; }
.pack { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border:1px solid var(--edge); border-radius:12px; }
.unavailable { color:var(--muted); font-size:14px; }
.shoplist li { align-items:center; }
.shoplist li > span { flex:1; font-size:14px; }
.buy { background:var(--twist); color:#1b1700; border:0; border-radius:999px; padding:8px 12px; font-weight:800; cursor:pointer; white-space:nowrap; }
.styles { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.style { display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:1px solid var(--edge); border-radius:12px; padding:8px 4px; color:var(--paper); cursor:pointer; }
.style.on { border-color:var(--twist); }
.style small { font-size:11px; font-weight:700; } .style em { font-style:normal; font-size:11px; color:var(--twist); }
.sw { width:30px; height:42px; border-radius:8px; border:1px solid var(--edge); }
.stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.stat { padding:12px; border:1px solid var(--edge); border-radius:12px; display:flex; flex-direction:column; gap:2px; }
.stat b { font-size:22px; font-family:var(--display); } .stat span { color:var(--muted); font-size:12px; }
.bk-ember { background:linear-gradient(135deg,#ff7a3c,#b3261e) !important; }
.bk-ocean { background:linear-gradient(135deg,#3aa6d8,#1a3f8f) !important; }
.bk-gold { background:linear-gradient(135deg,#ffe27a,#b87f00) !important; color:#3b2a00 !important; }
body.th-felt { --table:#12402c; } body.th-wine { --table:#3d1530; } body.th-arctic { --table:#12334a; }
.confetti { position:fixed; inset:0; pointer-events:none; z-index:30; overflow:hidden; }
.confetti i { position:absolute; top:-12px; width:8px; height:12px; border-radius:2px; animation:fall 2s ease-in forwards; }
@keyframes fall { to { transform:translate(var(--dx),105vh) rotate(720deg); opacity:.9; } }
@media (prefers-reduced-motion: reduce) { .shake, .bubble { animation:none; } }
.hand { align-items: stretch; }
.acard { flex: 1 1 0; max-width: 50%; min-height: 0 !important; max-height: 96px; }
.hand .empty { margin: 0; font-size: 13px; color: var(--muted); }
@media (max-height: 700px) { .tip, .bar { display: none; } .feed li:not(.new) { display: none; } .acard { max-height: 80px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Twist <em>21</em></h1>
          </div>
    <button class="link gold chipbtn" data-act="shop" type="button" aria-label="Open shop"><i class="coin"></i><span id="chipsN">0</span></button>
    <button class="link" data-act="menu" type="button" aria-label="Menu">Menu</button>
    <div class="target" aria-label="Current target"><div class="ring" id="ring"></div><b id="tnum">21</b><small>target</small></div>
  </header>
  <div class="bar"><div id="meta"></div></div>
  <main>
    <div class="opps" id="opps"></div>
  </main>
  <div class="feedbox" aria-live="polite">
    <p id="status"></p>
    <ul class="feed" id="feed"></ul>
  </div>
  <div class="you" id="you"></div>
</div>
<div id="overlay"></div>
<script>
(function () {
  'use strict';

  var hasDom = typeof document !== 'undefined' && !!document.getElementById;
  var $ = function (s) { return document.querySelector(s); };

  var WIN_POINTS = 5;
  var NAMES = ['You', 'Ava', 'Rex'];
  // Cautious Ava stands early and likes Shield. Reckless Rex keeps hitting and loves Force Hit.
  var RISK = { Ava: -1, Rex: 1 };
  var BASE = ['skip', 'swap', 'force', 'trim', 'shield', 'lower', 'raise', 'peek', 'reverse'];
  var EXTRA = ['double', 'freeze', 'steal'];
  var ORDER = BASE.concat(EXTRA);
  var EXTRA_PRICE = { double: 5000, freeze: 5000, steal: 6000 };

  // ---- chips economy (chips are never staked on a match, and have no cash value) ----
  var START_CHIPS = 10000;
  var DAILY = [1000, 1300, 1600, 2000, 2300, 2600, 3000];
  var REWARD = { round: 50, exact: 100, match: 200 };

    if (has('double') && T >= tgt - 9 && T <= tgt - 4 && r() < (risk > 0 ? 0.6 : 0.35)) return { k: 'double' };
    if (has('skip') && T < tgt - 5 && r() < 0.5) return { k: 'skip' };
    if (has('reverse') && r() < 0.2) return { k: 'reverse' };
    return null;
  }

  function botShouldHit(p) {
    var T = total(p), tgt = S.target, risk = p.risk || 0;
    if (T >= tgt) return false;
    var others = S.players.filter(function (o) { return o !== p; });
    if (others.every(function (o) { return o.bust; })) return false;
    var auto = tgt - 4 + (risk > 0 ? 1 : 0) - (risk < 0 ? 1 : 0);
    if (T < auto) return true;
    var best = 0;
    others.forEach(function (o) { if (!o.bust) best = Math.max(best, estTotal(p, o)); });
    var mult = risk < 0 ? 0.6 : risk > 0 ? 1.4 : 1;
    if (best > T && T < tgt - 1) return Math.random() < (p.shield ? 0.9 : 0.55) * mult;
    if (risk > 0 && best > T && T < tgt) return Math.random() < 0.5;
    if (p.shield && T < tgt - 1) return true;
    return false;
  }

  async function botTurn(p) {
    render();
    await sleep(900);
    var ch = botChooseAction(p);
    if (ch) {
      doAction(p, ch.k, ch.target);
      render();
      await sleep(1000);
      if (!active(p) || roundOver()) return;
    }
    if (botShouldHit(p)) doHit(p); else doStand(p);
    render();
    await sleep(700);
  }

  // ---------- human turn ----------
  function humanTurn() {
    return new Promise(function (res) {
      S.humanTurn = true; S.acted = false; S.pending = null; S.oddsShown = false;
      S.finish = function () { S.humanTurn = false; S.pending = null; S.finish = null; res(); };
      render();
    });
  }
  function playHuman(k, ti) {
    var me = S.players[0];
    if (!S.humanTurn || S.acted || !valid(me, k) || !me.actions.some(function (a) { return a.k === k; })) return;
    S.acted = true; S.pending = null;
    doAction(me, k, ti);
    render();
    if (!active(me) || roundOver()) { if (S.finish) S.finish(); }
  }
  function humanHit() {
    if (!S.humanTurn || S.pending) return;
    var me = S.players[0];
    S.humanTurn = false;
    haptic('light');
    doHit(me); render();
    if (S.finish) S.finish();
  }
  function humanStand() {
    if (!S.humanTurn || S.pending) return;
    var me = S.players[0];
    S.humanTurn = false;
    haptic('medium');
    doStand(me); render();
    if (S.finish) S.finish();
  }

  // ---------- flow ----------
  function initMatch() {
    S.players = NAMES.map(function (n, i) {
      return { name: n, human: i === 0, risk: RISK[n] || 0, say: '', points: 0, cards: [], actions: [], stood: false, bust: false, skip: false, frozen: false, shield: false, peeked: new Set() };
    });
    S.round = 0; S.log = []; S.champ = null; S.result = null; S.seen = new Set();
    startRound();
    S.phase = 'intro';
    render();
  }

  function startRound() {
    S.round++;
    S.deck = makeDeck(); S.discards = [];
    S.target = 21; S.dir = 1; S.roundEnded = false; S.flipped = false;
    S.pending = null; S.humanTurn = false; S.acted = false; S.result = null; S.shake = [];
    S.players.forEach(function (p) {
      p.cards = []; p.actions = []; p.stood = false; p.bust = false; p.skip = false; p.frozen = false; p.shield = false; p.peeked = new Set(); p.say = '';
    });
    S.players.forEach(function (p) { p.actions.push(drawAction()); });
    for (var pass = 0; pass < 2; pass++) S.players.forEach(function (p) { p.cards.push(drawNumber()); });
    S.cur = (S.round - 1) % S.players.length;
    log('Round ' + S.round + '. Target 21. ' + S.players[S.cur].name + (S.players[S.cur].human ? ' go' : ' goes') + ' first.');
    settleAll();
  }

  async function runRound() {
    var guard = 0;
    while (!roundOver()) {
      if (++guard > 600) throw new Error('round did not terminate');
      var p = S.players[S.cur];
      if (!active(p)) { S.cur = nextIdx(S.cur); continue; }
      if (p.skip) {
        p.skip = false; p.frozen = false;
        log(p.name + ' ' + V(p, 'miss', 'misses') + ' the turn.');
        render(); await sleep(800);
        S.cur = nextIdx(S.cur);
        continue;
      }
      S.acted = false;
      render();
      if (p.human && !S.autoHuman) await humanTurn(); else await botTurn(p);
      if (roundOver()) break;
      S.cur = nextIdx(S.cur);
    }
    await endRound();
  }

  function recordStats(rows, winner, pts, matchOver) {
    var st = G.stats, me = S.players[0];
    st.rounds++;
    if (me.bust) st.busts++;
    if (winner === me) { st.roundWins++; if (pts === 2) st.exact++; }
    if (matchOver) {
      st.matches++;
      if (S.champ === me) {
        st.wins++; st.streak++;
        if (st.streak > st.best) st.best = st.streak;
        var rival = 0;
        S.players.forEach(function (o) { if (o !== me) rival = Math.max(rival, o.points); });
        st.biggest = Math.max(st.biggest, me.points - rival);
      } else { st.streak = 0; }
    }
  }

  async function endRound() {
    S.roundEnded = true;
    S.phase = 'reveal';
    var rows = S.players.map(function (p) { return { p: p, total: total(p), bust: p.bust }; });
    var elig = rows.filter(function (r) { return !r.bust; });
    var winner = null, pts = 0, msg;
    if (!elig.length) {
      msg = 'Everyone busted. No points.';
    } else {
      var best = Math.max.apply(null, elig.map(function (r) { return r.total; }));
      var w = elig.filter(function (r) { return r.total === best; });
      if (w.length === 1) {
        winner = w[0].p;
        pts = best === S.target ? 2 : 1;
        winner.points += pts;
        msg = winner.name + ' ' + V(winner, 'win', 'wins') + ' with ' + best + (pts === 2 ? ', exactly on target: 2 points.' : ': 1 point.');
      } else {
        msg = 'Tie at ' + best + '. No points.';
      }
    }
    S.result = { rows: rows, winner: winner, pts: pts, msg: msg, target: S.target, reward: 0 };
    log('Round over. ' + msg);
    if (winner && !winner.human) say(winner, 'win');
    render();
    await sleep(1800);
    S.champ = S.players.find(function (p) { return p.points >= WIN_POINTS; }) || null;
    var reward = 0;
    if (winner && winner.human) reward += pts === 2 ? REWARD.exact : REWARD.round;
    if (S.champ && S.champ.human) reward += REWARD.match;
    recordStats(rows, winner, pts, !!S.champ);
    if (reward) { addChipsQuiet(reward); }
    S.result.reward = reward;
    if (winner && winner.human) { sfx(pts === 2 ? 'exact' : 'win'); haptic('success'); if (pts === 2) confetti(); }
    if (S.champ && S.champ.human) confetti();
    if (!G.tipsDone && S.round >= 3) { G.tipsDone = true; persist(); }
    S.phase = S.champ ? 'matchEnd' : 'roundEnd';
    persist();
    render();
  }

  async function beginRound() {
    S.phase = 'play';
    render();
    await sleep(500);
    await runRound();
  }
  function nextRound() {
    startRound();
    return beginRound();
  }

  // ---------- risk hint ----------
  function bustRisk(me) {
    var seen = [], v;
    for (v = 0; v <= 10; v++) seen[v] = 0;
    me.cards.forEach(function (c) { seen[c.v]++; });
    S.players.forEach(function (o, i) {
      if (o === me) return;
      o.cards.forEach(function (c, ci) { if (ci > 0 || me.peeked.has(i)) seen[c.v]++; });
    });
    S.discards.forEach(function (d) { seen[d]++; });
    var un = 0, bad = 0, gap = S.target - total(me);
    for (v = 1; v <= 10; v++) {
      var n = Math.max(0, 4 - seen[v]);
      un += n;
      if (v > gap) bad += n;
    }
    if (!un) return 0;
    // About 3 in 10 cards left in the deck are action cards, which cannot bust you.
    return Math.round((bad / un) * 0.69 * 20) * 5;
  }

  // ---------- rendering ----------
  function cardHTML(c, o) {
    var deal = S.seen.has(c.id) ? '' : ' deal';
    if (o.down) return '<div class="card back bk-' + G.back + deal + '" role="img" aria-label="Face-down card"><b>21</b></div>';
    var band = c.v <= 3 ? 'lo' : c.v <= 7 ? 'mid' : 'hi';
    return '<div class="card num ' + band + deal + (o.flip ? ' flip' : '') + (o.peeked ? ' peeked' : '') + (o.mine ? ' mine' : '') +
      '" role="img" aria-label="Card ' + c.v + '"><b>' + c.v + '</b><i>' + c.v + '</i></div>';
  }

    if (p.skip) h += '<span class="chip skip">' + (p.frozen ? 'Frozen' : 'Misses next turn') + '</span>';
    if (S.phase === 'play' && !S.roundEnded && S.cur === i && active(p)) h += '<span class="chip turn">' + (p.human ? 'Your turn' : 'Playing') + '</span>';
    return h;
  }

    return h + '</span>';
  }

    var me = S.players[0];

      return cardHTML(c, {
        down: ci === 0 && !reveal,

    }).join('');

      var pips = '';
      for (var k = 0; k < p.actions.length; k++) pips += '<span class="apip"></span>';
      h += '<div class="amini"><span class="apips">' + pips + '</span><span>' + p.actions.length + ' action' + (p.actions.length === 1 ? '' : 's') + '</span></div>';
    }
    return h + '</section>';
  }

  function handHTML(me) {
    var canAct = S.humanTurn && !S.acted && !S.pending;

    });

  }

  function tipText() {
    if (G.tipsDone || S.phase !== 'play' || !S.humanTurn || S.pending) return '';
    var me = S.players[0];
    if (S.round === 1 && !S.acted && me.actions.length) return 'Tip: play ONE action card per turn, then Hit or Stand. Tap a card to use it.';
    if (S.round === 1) return 'Tip: Hit draws a card. Stand locks your total. Closest to the target without going over wins.';
    if (S.round === 2) return 'Tip: landing exactly on the target scores 2 points. First to 5 wins the match.';
    return 'Tip: your first card is hidden from rivals. Peek lets you see theirs.';
  }

  function statusText() {
    if (S.phase === 'intro') return 'Ready when you are.';

    if (S.humanTurn) return S.acted ? 'Action played. Now Hit or Stand.' : 'Your turn. Play one action card if you like, then Hit or Stand.';
    var p = S.players[S.cur];
    return p && !p.human ? p.name + ' is playing…' : '';
  }

  function controlsHTML(me) {
    var h = '';

      var ts = targetsFor(me, S.pending.k) || [];
      h += '<div class="chooser" role="group" aria-label="Choose a target"><span>' + ACTIONS[S.pending.k].name + ' on:</span>';
      ts.forEach(function (o) {
        var i = idxOf(o);

        h += '<button class="pick" data-act="target" data-t="' + i + '">' + o.name + ' <small>' + info + (o.stood ? ' standing' : '') + '</small></button>';

    }

      '<button class="btn stand" data-act="stand"' + (on ? '' : ' disabled') + '>Stand</button>' + riskHTML + '</div>';
    return h;
  }

        return '<button class="style' + (on ? ' on' : '') + '" data-act="styleitem" data-kind="b" data-id="' + b.id + '" type="button"><span class="card back bk-' + b.id + '" style="--cw:30px;--ch:42px"><b>21</b></span><small>' + b.name + '</small><em>' + (on ? 'Equipped' : has ? 'Use' : fmt(b.price)) + '</em></button>';
      }).join('') + '</div>' +
      '<p class="legalhead">Table</p><div class="styles">' + THEMES.map(function (t) {
        var has = t.price === 0 || owned('t_' + t.id), on = G.theme === t.id;
        return '<button class="style' + (on ? ' on' : '') + '" data-act="styleitem" data-kind="t" data-id="' + t.id + '" type="button"><span class="sw" style="background:' + t.sw + '"></span><small>' + t.name + '</small><em>' + (on ? 'Equipped' : has ? 'Use' : fmt(t.price)) + '</em></button>';
      }).join('') + '</div>';
    }
    return '<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="ovt"><div class="dialog">' +
      '<p class="eyebrow"><i class="coin"></i> ' + fmt(G.chips) + ' chips</p><h2 id="ovt">Shop</h2>' +
      '<div class="tabs">' + tabs + '</div>' + body + (S.toast ? '<p class="codemsg" role="status">' + S.toast + '</p>' : '') +
      '<button id="primary" class="btn stand" data-act="closescreen">Back to the table</button></div></div>';
  }

  function overlayHTML() {
    if (S.screen === 'shop') return shopHTML();
    if (S.screen === 'stats') return statsHTML();
    if (S.screen === 'rules') return rulesHTML();
    if (S.screen === 'menu') return menuHTML();
    if (S.phase === 'intro') return introHTML();
    if (S.phase === 'roundEnd' || S.phase === 'matchEnd') return resultHTML();
    return '';
  }

  function render() {
    var me = S.players[0];
    if (!hasDom) return;
    var oppsHTML = S.players.map(function (p, i) { return i ? seatHTML(p, i) : ''; }).join('');
    var tip = tipText();
    var youHTML = (tip ? '<p class="tip">' + tip + '</p>' : '') + seatHTML(me, 0) + handHTML(me) + controlsHTML(me);
    var feed = S.log.slice(-2).map(function (m, i, a) { return '<li' + (i === a.length - 1 ? ' class="new"' : '') + '>' + m + '</li>'; }).join('');
    var order = S.dir === 1 ? 'You → Ava → Rex' : 'You → Rex → Ava';
    var overlay = overlayHTML();

    $('#opps').innerHTML = oppsHTML;
    $('#you').innerHTML = youHTML;
    $('#feed').innerHTML = feed;
    $('#status').textContent = statusText();
    $('#meta').textContent = 'Round ' + S.round + ' · ' + order;
    $('#chipsN').textContent = fmt(G.chips);
    document.body.className = 'th-' + G.theme;
    var tn = $('#tnum');
    if (tn.textContent !== String(S.target)) {
      tn.textContent = S.target;
      var ring = $('#ring');
      ring.classList.remove('twist'); void ring.offsetWidth; ring.classList.add('twist');
    }
    if (overlay !== S.lastOverlay) { $('#overlay').innerHTML = overlay; S.lastOverlay = overlay; }
    var key = S.screen ? S.screen : S.phase;
    if (overlay && S.overlayKey !== key) { var pb = $('#primary'); if (pb) pb.focus(); }
    S.overlayKey = overlay ? key : '';

    S.players.forEach(function (p) { p.cards.forEach(function (c) { S.seen.add(c.id); }); });
    if (S.roundEnded) S.flipped = true;
    S.shake = [];
  }

  // ---------- events ----------
  function open(s) { S.screen = s; S.toast = ''; render(); }
  function buyStyle(kind, id) {
    var list = kind === 'b' ? BACKS : THEMES;
    var item = list.filter(function (x) { return x.id === id; })[0];
    if (!item) return;
    var key = kind + '_' + id;
    if (item.price > 0 && !owned(key)) {
      if (!spend(item.price)) { S.toast = 'Not enough chips. Win rounds or claim the daily bonus.'; render(); return; }
      G.owned[key] = true; sfx('chip');
    }
    if (kind === 'b') G.back = id; else G.theme = id;
    S.toast = ''; persist(); render();
  }
  function onClick(e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var a = el.dataset.act, me = S.players[0];
    if (a === 'link') { if (inApp()) { e.preventDefault(); bridge('link', { url: el.dataset.url }); } return; }
    ac(); // unlock audio on the first tap
    if (a === 'card') {
      var k = el.dataset.k;
      if (!S.humanTurn || S.acted || !valid(me, k)) return;
      if (targetsFor(me, k)) { S.pending = { k: k }; render(); } else playHuman(k);
    } else if (a === 'target') {
      if (S.pending) playHuman(S.pending.k, +el.dataset.t);
    } else if (a === 'cancel') { S.pending = null; render(); }
    else if (a === 'hit') humanHit();
    else if (a === 'stand') humanStand();
    else if (a === 'start') { beginRound(); }
    else if (a === 'next') nextRound();
    else if (a === 'newmatch') { initMatch(); beginRound(); }
    else if (a === 'menu') open('menu');
    else if (a === 'shop') { S.shopTab = 'chips'; open('shop'); }
    else if (a === 'screen') open(el.dataset.s);
    else if (a === 'closescreen') { S.screen = null; render(); }
    else if (a === 'shoptab') { S.shopTab = el.dataset.tab; S.toast = ''; render(); }
    else if (a === 'sound') { G.mute = !G.mute; persist(); render(); }
    else if (a === 'claim') { var d = dailyInfo(); if (d) { G.streak = d.day; G.last = dayKey(0); addChipsQuiet(d.amount); sfx('chip'); haptic('success'); render(); } }
    else if (a === 'odds') {
      if (!S.humanTurn || S.oddsShown) return;
      if (spend(ODDS_COST)) { S.oddsShown = true; sfx('chip'); render(); }
      else { S.shopTab = 'chips'; open('shop'); S.toast = 'You need ' + ODDS_COST + ' chips for the odds meter.'; render(); }
    }
    else if (a === 'buycard') {
      var kk = el.dataset.k;
      if (owned('k_' + kk)) return;
      if (spend(EXTRA_PRICE[kk])) { G.owned['k_' + kk] = true; persist(); sfx('chip'); haptic('success'); S.toast = ACTIONS[kk].name + ' unlocked. It joins the deck next round.'; render(); }
      else { S.toast = 'Not enough chips. Win rounds, claim the daily bonus, or get more chips.'; render(); }
    }
    else if (a === 'styleitem') buyStyle(el.dataset.kind, el.dataset.id);
    else if (a === 'buychips') bridge('paywall');
  }
  // The Expo app calls these after RevenueCat confirms a purchase and passes localized prices.
  function setPackPrices(map) {
    PACKS.forEach(function (p) { if (map && map[p.id]) p.price = String(map[p.id]); });
    render();
  }
  function chipsPurchased(productId, txId) {
    var pack = PACKS.filter(function (p) { return p.id === productId; })[0];
    if (!pack) return false;
    if (txId) {
      if (G.txs.indexOf(txId) >= 0) return false;
      G.txs.push(txId); if (G.txs.length > 60) G.txs.shift();
    }
    addChipsQuiet(pack.chips);
    S.toast = '+' + fmt(pack.chips) + ' chips added.';
    sfx('chip'); haptic('success');
    render();
    return true;
  }

  if (hasDom) {
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && S.screen) { S.screen = null; render(); }
    });
    initMatch();
  }

  var api = {
    S: S, G: G, initMatch: initMatch, beginRound: beginRound, nextRound: nextRound, total: total, ACTIONS: ACTIONS, WIN_POINTS: WIN_POINTS,
    render: render, setPackPrices: setPackPrices, chipsPurchased: chipsPurchased, PACKS: PACKS, BASE: BASE, EXTRA: EXTRA, ORDER: ORDER,
    dailyInfo: dailyInfo, bustRisk: bustRisk, kinds: kinds, valid: valid, doAction: doAction
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else if (typeof window !== 'undefined') window.T21 = api;
})();
</script>
</body>
</html>
