<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twist 21</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&family=Unbounded:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout idea: a night-blue card table, three seats, one ring that spins when the target changes. */
:root {
  --ink: #100e26;
  --table: #1a1840;
  --edge: #2f2c66;
  --paper: #f3eee4;
  --paper-ink: #17152e;
  --hot: #ff5a3c;
  --twist: #ffd23f;
  --mint: #3ddc97;
  --rose: #ff4d6d;
  --muted: #a29fd0;
  --lo: #59c9d6;
  --mid: #b9a6ff;
  --hi: #ff8fa3;
  --display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
  --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --cw: 58px;
  --ch: 84px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: radial-gradient(1200px 600px at 50% -10%, #2a2670 0%, transparent 60%), var(--ink);
  color: var(--paper);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  min-height: 100%;
}
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--twist); outline-offset: 2px; }

.wrap { max-width: 1000px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }

/* header */
.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand h1 { font-family: var(--display); font-weight: 900; font-size: clamp(28px, 6vw, 44px); line-height: 1; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
.brand h1 em { font-style: normal; color: var(--twist); }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.target { position: relative; width: 88px; height: 88px; margin-left: auto; display: grid; place-items: center; }
.ring {
  position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 0deg, var(--twist), var(--hot), var(--twist));
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
}
.ring.twist { animation: spin 0.9s cubic-bezier(.2, .8, .2, 1); }
@keyframes spin { from { transform: rotate(-360deg) scale(.8); } to { transform: none; } }
.target b { font-family: var(--display); font-weight: 900; font-size: 30px; font-variant-numeric: tabular-nums; }
.target small { position: absolute; bottom: 14px; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.link { background: none; border: 1px solid var(--edge); color: var(--paper); border-radius: 999px; padding: 9px 16px; font-weight: 700; font-size: 14px; cursor: pointer; }
.link:hover { border-color: var(--twist); }

/* scoreboard */
.bar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; justify-content: space-between; }
.scores { display: flex; gap: 8px; flex-wrap: wrap; }
.sc { display: flex; align-items: center; gap: 10px; background: var(--table); border: 1px solid var(--edge); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 14px; }
.sc.me { border-color: var(--twist); }
.pips { display: inline-flex; gap: 4px; }
.pips i { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--muted); display: block; }
.pips i.on { background: var(--twist); border-color: var(--twist); }
#meta { color: var(--muted); font-size: 13px; }

/* seats */
.opps { display: grid; grid-template-columns: 1fr; gap: 12px; }
.seat { background: var(--table); border: 1px solid var(--edge); border-radius: 16px; padding: 14px; transition: border-color .2s, box-shadow .2s; }
.seat.is-turn { border-color: var(--twist); box-shadow: 0 0 0 4px rgba(255, 210, 63, .16); }
.seat-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.seat-head h2 { font-family: var(--display); font-weight: 700; font-size: 15px; margin: 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.seat-total { margin-left: auto; font-family: var(--display); font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
.chip { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--edge); color: var(--paper); }
.chip.turn { background: var(--twist); color: #1b1700; }
.chip.bust { background: var(--rose); color: #2b0510; }
.chip.shield { background: var(--mint); color: #05271a; }
.chip.skip { background: var(--hot); color: #2b0c05; }
.chip.win { background: var(--twist); color: #1b1700; }
.chip.stood { background: var(--edge); color: var(--muted); }
.cards { display: flex; flex-wrap: wrap; gap: 8px; min-height: var(--ch); }
.is-bust .cards { opacity: .5; }
.amini { display: flex; align-items: center; gap: 10px; margin-top: 10px; color: var(--muted); font-size: 13px; }
.apips { display: inline-flex; gap: 4px; }
.apip { width: 14px; height: 20px; border-radius: 3px; background: var(--hot); display: block; transform: rotate(-6deg); }
.apip:nth-child(2) { transform: rotate(0); } .apip:nth-child(3) { transform: rotate(6deg); }

/* cards */
.card {
  width: var(--cw); height: var(--ch); border-radius: 9px; position: relative; overflow: hidden;
  display: grid; place-items: center; flex: none;
  box-shadow: 0 2px 0 rgba(0, 0, 0, .4), 0 10px 18px -10px rgba(0, 0, 0, .8);
  font-family: var(--display);
}
.card.num { background: var(--paper); color: var(--paper-ink); }
.card.num b { font-weight: 900; font-size: calc(var(--cw) * .52); font-variant-numeric: tabular-nums; }
.card.num::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 7px; background: var(--band); }
.card.lo { --band: var(--lo); } .card.mid { --band: var(--mid); } .card.hi { --band: var(--hi); }
.card i { position: absolute; left: 6px; bottom: 4px; font-style: normal; font-size: 11px; font-weight: 700; opacity: .55; transform: rotate(180deg); }
.card.back {
  background: repeating-conic-gradient(from 0deg, #2c2966 0 15deg, #221f55 15deg 30deg);
  border: 2px solid var(--paper);
}
.card.back b { color: var(--twist); font-weight: 900; font-size: calc(var(--cw) * .36); background: var(--ink); width: 60%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; }
.card.peeked { outline: 3px dashed var(--twist); outline-offset: -3px; }
.card.mine { outline: 2px dashed var(--muted); outline-offset: -3px; }
.deal { animation: deal .35s ease-out both; }
.flip { animation: flip .45s ease-out both; }
@keyframes deal { from { transform: translateY(-22px) rotate(-7deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes flip { from { transform: rotateY(90deg); } to { transform: none; } }

/* your side */
.you { display: flex; flex-direction: column; gap: 12px; }
.hand { display: flex; flex-wrap: wrap; gap: 10px; }
.empty { margin: 0; color: var(--muted); font-size: 14px; padding: 8px 2px; }
.acard {
  flex: 1 1 104px; max-width: 150px; min-height: 140px; text-align: left; cursor: pointer;
  background: var(--hot); color: #240a04; border: 0; border-radius: 12px; padding: 12px;
  display: flex; flex-direction: column; gap: 6px;
  box-shadow: 0 2px 0 rgba(0, 0, 0, .4), 0 12px 20px -12px rgba(0, 0, 0, .8);
  transition: transform .15s;
}
.acard svg { width: 26px; height: 26px; flex: none; }
.acard strong { font-family: var(--display); font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: .02em; }
.acard span { font-size: 12px; line-height: 1.3; font-weight: 500; }
.acard:not(:disabled):hover { transform: translateY(-4px); }
.acard:disabled { background: #4a2a52; color: #b9a8c4; cursor: not-allowed; box-shadow: none; }
.chooser { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--table); border: 1px dashed var(--twist); border-radius: 12px; padding: 10px 12px; }
.chooser > span { font-weight: 800; margin-right: 4px; }
.pick { background: var(--paper); color: var(--paper-ink); border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 800; cursor: pointer; }
.pick small { font-weight: 600; opacity: .7; margin-left: 4px; }
.pick.ghost { background: transparent; color: var(--paper); border: 1px solid var(--edge); }
.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn { font-family: var(--display); font-weight: 800; font-size: 15px; padding: 14px 28px; border-radius: 12px; border: 2px solid transparent; cursor: pointer; letter-spacing: .01em; }
.btn.hit { background: var(--twist); color: #1b1700; }
.btn.stand { background: transparent; color: var(--paper); border-color: var(--paper); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn:not(:disabled):hover { filter: brightness(1.08); }
.risk { margin: 0; color: var(--muted); font-size: 14px; }

/* feed */
.feedbox { background: rgba(0, 0, 0, .25); border-radius: 12px; padding: 10px 14px; }
#status { margin: 0 0 6px; font-weight: 800; }
.feed { list-style: none; margin: 0; padding: 0; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 2px; }
.feed li.new { color: var(--paper); }

/* overlay */
.overlay { position: fixed; inset: 0; z-index: 10; background: rgba(10, 8, 30, .82); backdrop-filter: blur(4px); overflow: auto; padding: 16px; display: flex; }
.dialog { margin: auto; width: 100%; max-width: 580px; background: var(--table); border: 1px solid var(--edge); border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
.dialog h2 { font-family: var(--display); font-weight: 900; font-size: clamp(26px, 6vw, 36px); line-height: 1.05; margin: 0; text-wrap: balance; }
.dialog p { margin: 0; }
.eyebrow { color: var(--twist); font-weight: 800; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.dialog .btn { align-self: flex-start; margin-top: 4px; }
.rules { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--edge); vertical-align: middle; }
thead th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--display); font-weight: 800; }
.cardtable td.ic { width: 36px; color: var(--hot); }
.cardtable svg { width: 22px; height: 22px; display: block; }
.score { color: var(--muted); font-size: 14px; }

@media (min-width: 700px) {
  :root { --cw: 68px; --ch: 98px; }
  .opps { grid-template-columns: 1fr 1fr; }
  .wrap { padding: 24px; gap: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  .deal, .flip, .ring.twist { animation: none; }
  .acard { transition: none; }
}

/* paywall */
.link.gold { border-color: var(--twist); color: var(--twist); }
.link.gold:disabled { border-color: var(--edge); color: var(--muted); cursor: default; }
.chip.prem { background: var(--twist); color: #1b1700; margin-left: 6px; vertical-align: 1px; }
.risk-lock { background: none; border: 0; padding: 0; color: var(--muted); font-size: 14px; text-decoration: underline dotted; cursor: pointer; }
.risk-lock:hover { color: var(--twist); }
.perks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.perks li { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; }
.perks svg { width: 22px; height: 22px; flex: none; color: var(--hot); margin-top: 1px; }
.perks li:last-child svg { color: var(--mint); }
.price { color: var(--muted); }
.price b { font-family: var(--display); font-weight: 900; font-size: 30px; color: var(--paper); margin-right: 6px; }
a.btn { text-decoration: none; display: inline-block; }
.codebox { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--edge); padding-top: 12px; }
.codebox label { font-weight: 700; font-size: 14px; }
.coderow { display: flex; gap: 8px; flex-wrap: wrap; }
.coderow input { flex: 1 1 180px; min-width: 0; background: var(--ink); color: var(--paper); border: 1px solid var(--edge); border-radius: 10px; padding: 12px 14px; font: 700 16px var(--body); letter-spacing: .08em; text-transform: uppercase; }
.coderow .btn { padding: 12px 20px; font-size: 14px; margin: 0; }
.codemsg { min-height: 1.4em; color: var(--rose); font-size: 14px; }
.dialog > .link { align-self: flex-start; }

.legal { color: var(--muted); font-size: 13px; }
.legal a { color: var(--paper); }

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Twist <em>21</em></h1>
      <p>Blackjack with action cards. You against Ava and Rex.</p>
    </div>
    <button class="link" data-act="rulesopen" type="button">Rules</button>
    <button class="link gold" id="premBtn" data-act="paywall" type="button">Go Premium</button>
    <div class="target" aria-label="Current target"><div class="ring" id="ring"></div><b id="tnum">21</b><small>target</small></div>
  </header>
  <div class="bar">
    <div class="scores" id="score" aria-label="Scores"></div>
    <div id="meta"></div>
  </div>
  <main>
    <div class="opps" id="opps"></div>
  </main>
  <div class="feedbox" aria-live="polite">
    <p id="status"></p>
    <ul class="feed" id="feed"></ul>
  </div>
  <div class="you" id="you"></div>
</div>
<div id="overlay"></div>

    if (val === undefined) return mem[key] == null ? null : mem[key];
    mem[key] = val; return null;
  }
  function today() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function matchesToday() {
    var raw = store('twist21.day'), o = null;
    try { o = raw ? JSON.parse(raw) : null; } catch (e) { o = null; }
    return o && o.d === today() ? o.n : 0;
  }
  function bumpMatches() { store('twist21.day', JSON.stringify({ d: today(), n: matchesToday() + 1 })); }

  var ACTIONS = {
    skip:   { name: 'Skip',      desc: 'The next player loses their turn.' },
    swap:    { name: 'Swap',      desc: 'Trade your last face-up card with another player’s.' },
    force:   { name: 'Force Hit', desc: 'A player still in the round draws a card now.' },
    trim:    { name: 'Trim',      desc: 'Discard your highest face-up card.' },
    shield:  { name: 'Shield',    desc: 'Your next bust is cancelled and the card is discarded.' },
    lower:   { name: 'Target 18', desc: 'Target drops to 18. Everyone above it busts, you too.' },
    raise:   { name: 'Target 24', desc: 'Target rises to 24. Nobody busts.' },
    peek:    { name: 'Peek',      desc: 'Look at one player’s face-down card.' },
    reverse: { name: 'Reverse',   desc: 'Turn order flips direction.' }
  };

  var ICON_PATHS = {
    skip: '<path d="M5 5l8 7-8 7zM13 5l8 7-8 7z"/>',
    swap: '<path d="M4 8h14l-3-3M20 16H6l3 3"/>',
    force: '<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
    trim: '<circle cx="6" cy="7" r="2.5"/><circle cx="6" cy="17" r="2.5"/><path d="M8 8.5L20 18M8 15.5L20 6"/>',
    shield: '<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/>',
    lower: '<path d="M6 7l6 6 6-6M6 13l6 6 6-6"/>',
    raise: '<path d="M6 17l6-6 6 6M6 11l6-6 6 6"/>',
    peek: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    reverse: '<path d="M20 12a8 8 0 0 1-14 5.3M4 12a8 8 0 0 1 14-5.3"/><path d="M18 3v4h-4M6 21v-4h4"/>'
  };
  function icon(k) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON_PATHS[k] + '</svg>';
  }

  var S = {
    players: [], deck: [], discards: [], target: 21, dir: 1, cur: 0, round: 0,
    phase: 'intro', humanTurn: false, acted: false, pending: null, log: [],
    seen: new Set(), roundEnded: false, flipped: false, rules: false, uid: 0,
    result: null, champ: null, finish: null, fast: false, autoHuman: false, overlayKey: '',
    premium: false, paywall: null, codeDraft: '', codeMsg: '', lastOverlay: null
  };
  function kinds() { return S.premium ? ORDER : FREE_KINDS; }
  function tryRedeem(code) {
    var h = codeHash(code);
    if (h && HASHES.indexOf(h) >= 0) { S.premium = true; store('twist21.premium', h); return true; }
    return false;
  }
  function allowMatch() {
    if (S.premium) return true;
    if (matchesToday() >= FREE_MATCHES) { S.paywall = { reason: 'limit' }; render(); return false; }
    bumpMatches();
    return true;
  }

  function sleep(ms) {
    return S.fast ? Promise.resolve() : new Promise(function (r) { setTimeout(r, ms); });
  }
  function log(m) { S.log.push(m); if (S.log.length > 40) S.log.shift(); }

  // ---------- helpers ----------
  function total(p) { var t = 0; for (var i = 0; i < p.cards.length; i++) t += p.cards[i].v; return t; }
  function visTotal(p) { var t = 0; for (var i = 1; i < p.cards.length; i++) t += p.cards[i].v; return t; }
  function active(p) { return !p.stood && !p.bust; }
  function idxOf(p) { return S.players.indexOf(p); }
  function nextIdx(from) { var n = S.players.length; return (from + S.dir + n) % n; }
  function roundOver() { return !S.players.some(active); }
  function nextActiveFrom(from) {
    var i = from;
    for (var n = 0; n < S.players.length; n++) {
      i = nextIdx(i);
      if (i === from) break;
      if (active(S.players[i])) return i;
    }
    return -1;
  }
  function V(p, a, b) { return p.human ? a : b; }
  function obj(p) { return p.human ? 'you' : p.name; }

  // ---------- deck ----------
  function makeDeck() {
    var d = [], v, n;
    for (v = 1; v <= 10; v++) for (n = 0; n < 4; n++) d.push({ id: ++S.uid, t: 'n', v: v });
    kinds().forEach(function (k) { for (var j = 0; j < 2; j++) d.push({ id: ++S.uid, t: 'a', k: k }); });
    for (var i = d.length - 1; i > 0; i--) {
      var j2 = Math.floor(Math.random() * (i + 1));
      var tmp = d[i]; d[i] = d[j2]; d[j2] = tmp;
    }
    return d;
  }
  function drawNumber() { var i = S.deck.findIndex(function (c) { return c.t === 'n'; }); return S.deck.splice(i, 1)[0]; }
  function drawAction() { var i = S.deck.findIndex(function (c) { return c.t === 'a'; }); return S.deck.splice(i, 1)[0]; }
  function drawAny() {
    if (!S.deck.length) { S.deck = makeDeck(); S.discards = []; }
    return S.deck.shift();
  }

  // ---------- rules engine ----------
  function giveCard(p, c) {
    if (c.t === 'a') {
      p.actions.push(c);
      if (p.actions.length > 3) {
        var d = p.actions.shift();
        log(p.name + ' ' + V(p, 'drop', 'drops') + ' ' + ACTIONS[d.k].name + ' (hand limit is 3).');
      }
      log(p.name + ' ' + V(p, 'draw', 'draws') + ' an action card' + (p.human ? ': ' + ACTIONS[c.k].name + '.' : '.'));
      return;
    }
    p.cards.push(c);
    if (total(p) > S.target) {
      if (p.shield) {
        p.shield = false;
        p.cards.pop();
        S.discards.push(c.v);
        log(p.name + V(p, 'r', '’s') + ' Shield absorbs a ' + c.v + '.');
      } else {
        p.bust = true;
        log(p.name + ' ' + V(p, 'draw', 'draws') + ' ' + c.v + ' and ' + V(p, 'bust', 'busts') + ' with ' + total(p) + '.');
      }
    } else {
      log(p.name + ' ' + V(p, 'draw', 'draws') + ' ' + c.v + '.');
    }
  }

  function settleAll() {
    S.players.forEach(function (p) {
      if (p.bust) return;
      var t = total(p);
      if (t > S.target) {
        p.bust = true;
        log(p.name + ' ' + V(p, 'go', 'goes') + ' over ' + S.target + ' and ' + V(p, 'bust', 'busts') + '.');
      } else if (t === S.target && !p.stood) {
        p.stood = true;
        log(p.name + ' ' + V(p, 'hit', 'hits') + ' ' + S.target + ' on the nose.');
      }
    });
  }

  function targetsFor(p, k) {
    var others = S.players.filter(function (o) { return o !== p && !o.bust; });
    if (k === 'swap') return p.cards.length >= 2 ? others.filter(function (o) { return o.cards.length >= 2; }) : [];
    if (k === 'force') return others.filter(function (o) { return !o.stood; });
    if (k === 'peek') return others.filter(function (o) { return !p.peeked.has(idxOf(o)); });
    return null;
  }
  function valid(p, k) {
    var t = targetsFor(p, k);
    if (t) return t.length > 0;
    if (k === 'skip') return nextActiveFrom(idxOf(p)) !== -1;
    if (k === 'trim') return p.cards.length >= 2;
    if (k === 'shield') return !p.shield;
    if (k === 'lower') return S.target > 18;
    if (k === 'raise') return S.target < 24;
    return true;
  }

  function doAction(p, k, ti) {
    var i = p.actions.findIndex(function (a) { return a.k === k; });
    if (i < 0) return;
    p.actions.splice(i, 1);
    var t = ti != null ? S.players[ti] : null;
    var P = p.name + ' ' + V(p, 'play', 'plays') + ' ';
    if (k === 'skip') {
      var n = nextActiveFrom(idxOf(p));
      if (n >= 0) { S.players[n].skip = true; log(P + 'Skip. ' + (S.players[n].human ? 'You miss' : S.players[n].name + ' misses') + ' a turn.'); }
    } else if (k === 'swap') {
      var a = p.cards.length - 1, b = t.cards.length - 1;
      var mine = p.cards[a], theirs = t.cards[b];
      p.cards[a] = theirs; t.cards[b] = mine;
      log(P + 'Swap with ' + obj(t) + ': a ' + mine.v + ' for a ' + theirs.v + '.');
    } else if (k === 'force') {
      log(P + 'Force Hit on ' + obj(t) + '.');
      giveCard(t, drawAny());
    } else if (k === 'trim') {
      var hi = 1;
      for (var x = 2; x < p.cards.length; x++) if (p.cards[x].v > p.cards[hi].v) hi = x;
      var gone = p.cards.splice(hi, 1)[0];
      S.discards.push(gone.v);
      log(P + 'Trim and ' + V(p, 'discard', 'discards') + ' a ' + gone.v + '.');
    } else if (k === 'shield') {
      p.shield = true;
      log(P + 'Shield.');
    } else if (k === 'lower') {
      S.target = 18;
      log(P + 'Target 18. The target is now 18.');
    } else if (k === 'raise') {
      S.target = 24;
      log(P + 'Target 24. The target is now 24.');
    } else if (k === 'peek') {
      p.peeked.add(ti);
      log(P + 'Peek at ' + (t.human ? 'your' : t.name + '’s') + ' face-down card' + (p.human ? ': it is a ' + t.cards[0].v + '.' : '.'));
    } else if (k === 'reverse') {
      S.dir *= -1;
      log(P + 'Reverse. Turn order flips.');
    }
    settleAll();
  }

  function doHit(p) { giveCard(p, drawAny()); settleAll(); }
  function doStand(p) { p.stood = true; log(p.name + ' ' + V(p, 'stand', 'stands') + ' on ' + total(p) + (p.human ? '.' : ' (' + visTotal(p) + ' showing).')); }

  // ---------- bots ----------
  function botKnows(p, o) { return o === p || p.peeked.has(idxOf(o)); }
  function estTotal(p, o) {
    if (!o.cards.length) return 0;
    return visTotal(o) + (botKnows(p, o) ? o.cards[0].v : 5.5);
  }

  function botChooseAction(p) {
    var has = function (k) { return p.actions.some(function (a) { return a.k === k; }) && valid(p, k); };
    var T = total(p), tgt = S.target;
    var opps = S.players.filter(function (o) { return o !== p && !o.bust; });
    var r = Math.random;

    if (has('lower') && T <= 18) {
      var victims = opps.filter(function (o) { return estTotal(p, o) > 18; }).length;
      if (victims >= 1 && r() < 0.7) return { k: 'lower' };
    }
    if (has('raise') && T >= tgt - 2 && T < 24 && T !== tgt && r() < 0.6) return { k: 'raise' };
    if (has('peek')) {
      var pt = targetsFor(p, 'peek')[0];
      return { k: 'peek', target: idxOf(pt) };
    }
    if (has('shield') && T >= 9) return { k: 'shield' };
    if (has('force')) {
      var cands = targetsFor(p, 'force').slice().sort(function (a, b) { return estTotal(p, b) - estTotal(p, a); });
      if (cands.length && estTotal(p, cands[0]) >= tgt - 6 && r() < 0.75) return { k: 'force', target: idxOf(cands[0]) };
    }
    if (has('swap')) {
      var myLast = p.cards[p.cards.length - 1].v;
      var sc = targetsFor(p, 'swap');
      for (var i = 0; i < sc.length; i++) {
        var o = sc[i], oLast = o.cards[o.cards.length - 1].v;
        var myNew = T - myLast + oLast;
        var oNew = estTotal(p, o) - oLast + myLast;
        if (myNew <= tgt && ((oNew > tgt && r() < 0.8) || (myNew - T >= 3 && T < tgt - 4 && r() < 0.5))) {
          return { k: 'swap', target: idxOf(o) };
        }
      }
    }
    if (has('trim') && T >= tgt - 3 && T < tgt && r() < 0.5) return { k: 'trim' };
    if (has('skip') && T < tgt - 5 && r() < 0.5) return { k: 'skip' };
    if (has('reverse') && r() < 0.2) return { k: 'reverse' };
    return null;
  }

  function botShouldHit(p) {
    var T = total(p), tgt = S.target;
    if (T >= tgt) return false;
    var others = S.players.filter(function (o) { return o !== p; });
    if (others.every(function (o) { return o.bust; })) return false;
    if (T < tgt - 4) return true;
    var best = 0;
    others.forEach(function (o) { if (!o.bust) best = Math.max(best, estTotal(p, o)); });
    if (best > T && T < tgt - 1) return Math.random() < (p.shield ? 0.9 : 0.55);
    if (p.shield && T < tgt - 1) return true;
    return false;
  }

  async function botTurn(p) {
    render();
    await sleep(900);
    var ch = botChooseAction(p);
    if (ch) {
      doAction(p, ch.k, ch.target);
      render();
      await sleep(1000);
      if (!active(p) || roundOver()) return;
    }
    if (botShouldHit(p)) doHit(p); else doStand(p);
    render();
    await sleep(700);
  }

  // ---------- human turn ----------
  function humanTurn() {
    return new Promise(function (res) {
      S.humanTurn = true; S.acted = false; S.pending = null;
      S.finish = function () { S.humanTurn = false; S.pending = null; S.finish = null; res(); };
      render();
    });
  }
  function playHuman(k, ti) {
    var me = S.players[0];
    if (!S.humanTurn || S.acted || !valid(me, k) || !me.actions.some(function (a) { return a.k === k; })) return;
    S.acted = true; S.pending = null;
    doAction(me, k, ti);
    render();
    if (!active(me) || roundOver()) { if (S.finish) S.finish(); }
  }
  function humanHit() {
    if (!S.humanTurn || S.pending) return;
    var me = S.players[0];
    S.humanTurn = false;
    doHit(me); render();
    if (S.finish) S.finish();
  }
  function humanStand() {
    if (!S.humanTurn || S.pending) return;
    var me = S.players[0];
    S.humanTurn = false;
    doStand(me); render();
    if (S.finish) S.finish();
  }

  // ---------- flow ----------
  function initMatch() {
    S.players = NAMES.map(function (n, i) {
      return { name: n, human: i === 0, points: 0, cards: [], actions: [], stood: false, bust: false, skip: false, shield: false, peeked: new Set() };
    });
    S.round = 0; S.log = []; S.champ = null; S.result = null; S.seen = new Set();
    var saved = store('twist21.premium');
    if (saved && HASHES.indexOf(saved) >= 0) S.premium = true;
    startRound();
    S.phase = 'intro';
    render();
  }

  function startRound() {
    S.round++;
    S.deck = makeDeck(); S.discards = [];
    S.target = 21; S.dir = 1; S.roundEnded = false; S.flipped = false;
    S.pending = null; S.humanTurn = false; S.acted = false; S.result = null;
    S.players.forEach(function (p) {
      p.cards = []; p.actions = []; p.stood = false; p.bust = false; p.skip = false; p.shield = false; p.peeked = new Set();
    });
    S.players.forEach(function (p) { p.actions.push(drawAction()); });
    for (var pass = 0; pass < 2; pass++) S.players.forEach(function (p) { p.cards.push(drawNumber()); });
    S.cur = (S.round - 1) % S.players.length;
    log('Round ' + S.round + '. Target 21. ' + S.players[S.cur].name + (S.players[S.cur].human ? ' go' : ' goes') + ' first.');
    settleAll();
  }

  async function runRound() {
    var guard = 0;
    while (!roundOver()) {
      if (++guard > 600) throw new Error('round did not terminate');
      var p = S.players[S.cur];
      if (!active(p)) { S.cur = nextIdx(S.cur); continue; }
      if (p.skip) {
        p.skip = false;
        log(p.name + ' ' + V(p, 'miss', 'misses') + ' the turn.');
        render(); await sleep(800);
        S.cur = nextIdx(S.cur);
        continue;
      }
      S.acted = false;
      render();
      if (p.human && !S.autoHuman) await humanTurn(); else await botTurn(p);
      if (roundOver()) break;
      S.cur = nextIdx(S.cur);
    }
    await endRound();
  }

  async function endRound() {
    S.roundEnded = true;
    S.phase = 'reveal';
    var rows = S.players.map(function (p) { return { p: p, total: total(p), bust: p.bust }; });
    var elig = rows.filter(function (r) { return !r.bust; });
    var winner = null, pts = 0, msg;
    if (!elig.length) {
      msg = 'Everyone busted. No points.';
    } else {
      var best = Math.max.apply(null, elig.map(function (r) { return r.total; }));
      var w = elig.filter(function (r) { return r.total === best; });
      if (w.length === 1) {
        winner = w[0].p;
        pts = best === S.target ? 2 : 1;
        winner.points += pts;
        msg = winner.name + ' ' + V(winner, 'win', 'wins') + ' with ' + best + (pts === 2 ? ', exactly on target: 2 points.' : ': 1 point.');
      } else {
        msg = 'Tie at ' + best + '. No points.';
      }
    }
    S.result = { rows: rows, winner: winner, pts: pts, msg: msg, target: S.target };
    log('Round over. ' + msg);
    render();
    await sleep(1800);
    S.champ = S.players.find(function (p) { return p.points >= WIN_POINTS; }) || null;
    S.phase = S.champ ? 'matchEnd' : 'roundEnd';
    render();
  }

  async function beginRound() {
    S.phase = 'play';
    render();
    await sleep(500);
    await runRound();
  }
  function nextRound() {
    startRound();
    return beginRound();
  }

  // ---------- risk hint ----------
  function bustRisk(me) {
    var seen = [], v;
    for (v = 0; v <= 10; v++) seen[v] = 0;
    me.cards.forEach(function (c) { seen[c.v]++; });
    S.players.forEach(function (o, i) {
      if (o === me) return;
      o.cards.forEach(function (c, ci) { if (ci > 0 || me.peeked.has(i)) seen[c.v]++; });
    });
    S.discards.forEach(function (d) { seen[d]++; });
    var un = 0, bad = 0, gap = S.target - total(me);
    for (v = 1; v <= 10; v++) {
      var n = Math.max(0, 4 - seen[v]);
      un += n;
      if (v > gap) bad += n;
    }
    if (!un) return 0;
    return Math.round((bad / un) * 0.69 * 20) * 5;
  }

  // ---------- rendering ----------
  function cardHTML(c, o) {
    var deal = S.seen.has(c.id) ? '' : ' deal';
    if (o.down) return '<div class="card back' + deal + '" role="img" aria-label="Face-down card"><b>21</b></div>';
    var band = c.v <= 3 ? 'lo' : c.v <= 7 ? 'mid' : 'hi';
    return '<div class="card num ' + band + deal + (o.flip ? ' flip' : '') + (o.peeked ? ' peeked' : '') + (o.mine ? ' mine' : '') +
      '" role="img" aria-label="Card ' + c.v + '"><b>' + c.v + '</b><i>' + c.v + '</i></div>';
  }

  function chips(p, i) {
    var h = '';
    if (p.bust) h += '<span class="chip bust">Bust</span>';
    else if (p.stood) h += '<span class="chip stood">Standing</span>';
    if (p.shield) h += '<span class="chip shield">Shield up</span>';
    if (p.skip) h += '<span class="chip skip">Misses next turn</span>';
    if (S.phase === 'play' && !S.roundEnded && S.cur === i && active(p)) h += '<span class="chip turn">' + (p.human ? 'Your turn' : 'Playing') + '</span>';
    return h;
  }

  function seatHTML(p, i) {
    var me = S.players[0];
    var reveal = S.roundEnded || p.human || me.peeked.has(i);
    var cards = p.cards.map(function (c, ci) {
      return cardHTML(c, {
        down: ci === 0 && !reveal,
        flip: ci === 0 && S.roundEnded && !S.flipped && !p.human,
        peeked: ci === 0 && !p.human && !S.roundEnded && me.peeked.has(i),
        mine: ci === 0 && p.human
      });
    }).join('');
    var totalTxt = reveal ? String(total(p)) : visTotal(p) + '+?';
    var turn = S.phase === 'play' && !S.roundEnded && S.cur === i && active(p);
    var h = '<section class="seat' + (turn ? ' is-turn' : '') + (p.bust ? ' is-bust' : '') + (p.human ? ' is-me' : '') + '" aria-label="' + p.name + '">';
    h += '<div class="seat-head"><h2>' + p.name + '</h2><div class="chips">' + chips(p, i) + '</div><div class="seat-total" title="' + (reveal ? 'Total' : 'Face-up total plus one hidden card') + '">' + totalTxt + '</div></div>';
    h += '<div class="cards">' + cards + '</div>';
    if (!p.human) {
      var pips = '';
      for (var k = 0; k < p.actions.length; k++) pips += '<span class="apip"></span>';
      h += '<div class="amini"><span class="apips">' + pips + '</span><span>' + p.actions.length + ' action card' + (p.actions.length === 1 ? '' : 's') + '</span></div>';
    }
    return h + '</section>';
  }

  function handHTML(me) {
    var canAct = S.humanTurn && !S.acted && !S.pending;
    var h = '<div class="hand" role="group" aria-label="Your action cards">';
    if (!me.actions.length) h += '<p class="empty">No action cards. Drawing one counts as your hit.</p>';
    me.actions.forEach(function (a) {
      var ok = canAct && valid(me, a.k);
      var A = ACTIONS[a.k];
      h += '<button class="acard" data-act="card" data-k="' + a.k + '"' + (ok ? '' : ' disabled') + '>' +
        icon(a.k) + '<strong>' + A.name + '</strong><span>' + A.desc + '</span></button>';
    });
    return h + '</div>';
  }

  function statusText() {
    var me = S.players[0];
    if (S.phase === 'intro') return 'Ready when you are.';
    if (S.roundEnded) return 'Cards revealed.';
    if (S.pending) return 'Pick a target for ' + ACTIONS[S.pending.k].name + '.';
    if (S.humanTurn) return S.acted ? 'Action played. Now Hit or Stand.' : 'Your turn. Play one action card if you like, then Hit or Stand.';
    var p = S.players[S.cur];
    return p && !p.human ? p.name + ' is playing…' : '';
  }

  function controlsHTML(me) {
    var h = '';
    if (S.pending) {
      var ts = targetsFor(me, S.pending.k) || [];
      h += '<div class="chooser" role="group" aria-label="Choose a target"><span>' + ACTIONS[S.pending.k].name + ' on:</span>';
      ts.forEach(function (o) {
        var i = idxOf(o);
        var info = (S.roundEnded || me.peeked.has(i)) ? total(o) : visTotal(o) + '+?';
        h += '<button class="pick" data-act="target" data-t="' + i + '">' + o.name + ' <small>' + info + (o.stood ? ' standing' : '') + '</small></button>';
      });
      h += '<button class="pick ghost" data-act="cancel">Cancel</button></div>';
    }
    var on = S.humanTurn && !S.pending;
    var risk = on && S.premium ? bustRisk(me) : null;
    var riskHTML = !S.premium
      ? '<button class="risk-lock" data-act="paywall" type="button">Bust chance meter: Premium</button>'
      : '<p class="risk">' + (risk === null ? '&nbsp;' : (total(me) >= S.target ? 'Already on target.' : 'Bust chance if you hit: about ' + risk + '%')) + '</p>';
    h += '<div class="controls"><button class="btn hit" data-act="hit"' + (on ? '' : ' disabled') + '>Hit</button>' +
      '<button class="btn stand" data-act="stand"' + (on ? '' : ' disabled') + '>Stand</button>' + riskHTML + '</div>';
    return h;
  }

  function resultHTML() {
    var R = S.result, me = S.players[0];
    var final = S.phase === 'matchEnd';
    var head = final ? (S.champ.human ? 'You win the match' : S.champ.name + ' wins the match')
      : (R.winner ? (R.winner.human ? 'You take the round' : R.winner.name + ' takes the round') : 'No winner this round');
    var rows = R.rows.map(function (r) {
      var res = r.bust ? '<span class="chip bust">Bust</span>' : (R.winner === r.p ? '<span class="chip win">+' + R.pts + (R.pts === 2 ? ' exact' : '') + '</span>' : '<span class="chip stood">Standing</span>');
      return '<tr><th scope="row">' + r.p.name + '</th><td>' + r.p.cards.map(function (c) { return c.v; }).join(' · ') + '</td><td class="num">' + r.total + '</td><td>' + res + '</td></tr>';
    }).join('');
    var score = S.players.map(function (p) { return p.name + ' ' + p.points; }).join('  ·  ');
    return '<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="ovt"><div class="dialog">' +
      '<p class="eyebrow">Round ' + S.round + ' · target ' + R.target + '</p><h2 id="ovt">' + head + '</h2><p>' + R.msg + '</p>' +
      '<div class="tablewrap"><table><thead><tr><th>Player</th><th>Cards</th><th class="num">Total</th><th>Result</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<p class="score">Score (first to ' + WIN_POINTS + '): ' + score + '</p>' +
      '<button id="primary" class="btn hit" data-act="' + (final ? 'newmatch' : 'next') + '">' + (final ? 'New match' : 'Next round') + '</button></div></div>';
  }

  function rulesBody() {
    var rows = ORDER.map(function (k) {
      var lock = !S.premium && FREE_KINDS.indexOf(k) < 0 ? ' <span class="chip prem">Premium</span>' : '';
      return '<tr><td class="ic">' + icon(k) + '</td><th scope="row">' + ACTIONS[k].name + lock + '</th><td>' + ACTIONS[k].desc + '</td></tr>';
    }).join('');
    return '<ul class="rules">' +
      '<li>Finish a round closest to the target, <strong>21</strong>, without going over. Number cards run 1 to 10.</li>' +
      '<li>Each turn, play <strong>one</strong> action card if you want, then <strong>Hit</strong> (draw) or <strong>Stand</strong>.</li>' +
      '<li>Your first card is face-down to the others. Everything else is face-up.</li>' +
      '<li>If a hit draws an action card, it goes to your hand (limit 3) and your turn ends. You start each round with one.</li>' +
      '<li>Win a round for 1 point, or 2 if you land exactly on target. First to ' + WIN_POINTS + ' wins the match. Ties score nothing.</li></ul>' +
      '<div class="tablewrap"><table class="cardtable"><tbody>' + rows + '</tbody></table></div>';
  }

  function introHTML() {
    return '<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="ovt"><div class="dialog">' +
      '<p class="eyebrow">Blackjack with action cards</p><h2 id="ovt">Twist 21</h2>' +
      '<p>You against Ava and Rex. Hit and stand like blackjack, then play action cards to skip, swap, peek, shield and bend the target itself.</p>' + rulesBody() +
      (S.premium ? '' : '<p class="score">Free: ' + FREE_MATCHES + ' matches a day and 5 of the 9 action cards. Premium unlocks all of it for ' + PRICE + ' once.</p>') +
      '<button id="primary" class="btn hit" data-act="start">Deal me in</button></div></div>';
  }

  function rulesHTML() {
    return '<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="ovt"><div class="dialog">' +
      '<p class="eyebrow">How to play</p><h2 id="ovt">Twist 21 rules</h2>' + rulesBody() +
      '<button id="primary" class="btn stand" data-act="closerules">Back to the table</button></div></div>';
  }

  function paywallHTML() {
    var why = S.paywall && S.paywall.reason === 'limit'
      ? 'You have played your ' + FREE_MATCHES + ' free matches today. They reset at midnight, or unlock everything now.'
      : 'Free play has 5 of the 9 action cards and ' + FREE_MATCHES + ' matches a day.';
    var app = inApp();
    var buy = app
      ? '<button id="primary" class="btn hit" data-act="nativebuy" type="button">Unlock for ' + PRICE + '</button>'
      : PAY_URL
        ? '<a id="primary" class="btn hit" href="' + PAY_URL + '" target="_blank" rel="noopener">Unlock for ' + PRICE + '</a>'
        : '<button id="primary" class="btn hit" type="button" disabled>Checkout opens soon</button>';
    var codeBox = app
      ? '<div class="codebox"><button class="btn stand" data-act="nativerestore" type="button">Restore purchases</button></div>'
      : '<div class="codebox"><label for="code">Already paid? Enter your unlock code</label>' +
        '<div class="coderow"><input id="code" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="T21-XXXX-XXXX" value="' + S.codeDraft.replace(/"/g, '') + '">' +
        '<button class="btn stand" data-act="redeem" type="button">Redeem</button></div>' +
        '<p class="codemsg" role="status">' + S.codeMsg + '</p></div>';
    var locked = ORDER.filter(function (k) { return FREE_KINDS.indexOf(k) < 0; }).map(function (k) {
      return '<li>' + icon(k) + '<span><strong>' + ACTIONS[k].name + '</strong> ' + ACTIONS[k].desc + '</span></li>';
    }).join('');
    return '<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="ovt"><div class="dialog">' +
      '<p class="eyebrow">Twist 21 Premium</p><h2 id="ovt">Unlock the whole deck</h2><p>' + why + '</p>' +
      '<ul class="perks">' + locked + '<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg><span><strong>Unlimited matches</strong> and the live bust-chance meter.</span></li></ul>' +
      '<p class="price"><b>' + PRICE + '</b> once. Yours for good, no subscription.</p>' + buy +
      codeBox +
      '<p class="legal">One-time purchase, no subscription. <a href="' + TERMS_URL + '" target="_blank" rel="noopener" data-act="link" data-url="' + TERMS_URL + '">Terms</a> \u00b7 <a href="' + PRIVACY_URL + '" target="_blank" rel="noopener" data-act="link" data-url="' + PRIVACY_URL + '">Privacy</a></p>' +
      '<button class="link" data-act="closepay" type="button">Maybe later</button></div></div>';
  }

  function overlayHTML() {
    if (S.paywall) return paywallHTML();
    if (S.rules) return rulesHTML();
    if (S.phase === 'intro') return introHTML();
    if (S.phase === 'roundEnd' || S.phase === 'matchEnd') return resultHTML();
    return '';
  }

  function render() {
    var me = S.players[0];
    var oppsHTML = S.players.map(function (p, i) { return i ? seatHTML(p, i) : ''; }).join('');
    var youHTML = seatHTML(me, 0) + handHTML(me) + controlsHTML(me);
    var feed = S.log.slice(-4).map(function (m, i, a) { return '<li' + (i === a.length - 1 ? ' class="new"' : '') + '>' + m + '</li>'; }).join('');
    var order = S.dir === 1 ? 'You → Ava → Rex' : 'You → Rex → Ava';
    var score = S.players.map(function (p) {
      var pips = '';
      for (var i = 0; i < WIN_POINTS; i++) pips += '<i class="' + (i < p.points ? 'on' : '') + '"></i>';
      return '<div class="sc' + (p.human ? ' me' : '') + '"><span>' + p.name + '</span><span class="pips" aria-label="' + p.points + ' points">' + pips + '</span></div>';
    }).join('');
    var overlay = overlayHTML();
    if (!hasDom) return;

    $('#opps').innerHTML = oppsHTML;
    $('#you').innerHTML = youHTML;
    $('#feed').innerHTML = feed;
    $('#status').textContent = statusText();
    $('#score').innerHTML = score;
    $('#meta').textContent = 'Round ' + S.round + ' · order ' + order;
    var tn = $('#tnum');
    if (tn.textContent !== String(S.target)) {
      tn.textContent = S.target;
      var ring = $('#ring');
      ring.classList.remove('twist'); void ring.offsetWidth; ring.classList.add('twist');
    }
    var pb0 = $('#premBtn');
    pb0.textContent = S.premium ? 'Premium unlocked' : 'Go Premium';
    pb0.disabled = S.premium;
    if (overlay !== S.lastOverlay) { $('#overlay').innerHTML = overlay; S.lastOverlay = overlay; }
    var key = S.paywall ? 'paywall' : S.rules ? 'rules' : S.phase;
    if (overlay && S.overlayKey !== key) { var pb = $('#primary'); if (pb) pb.focus(); }
    S.overlayKey = overlay ? key : '';

    S.players.forEach(function (p) { p.cards.forEach(function (c) { S.seen.add(c.id); }); });
    if (S.roundEnded) S.flipped = true;
  }

  // ---------- events ----------
  function onClick(e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var a = el.dataset.act, me = S.players[0];
    if (a === 'link') { if (inApp()) { e.preventDefault(); toApp('link', el.dataset.url); } return; }
    if (a === 'card') {
      var k = el.dataset.k;
      if (!S.humanTurn || S.acted || !valid(me, k)) return;
      if (targetsFor(me, k)) { S.pending = { k: k }; render(); } else playHuman(k);
    } else if (a === 'target') {
      if (S.pending) playHuman(S.pending.k, +el.dataset.t);
    } else if (a === 'cancel') { S.pending = null; render(); }
    else if (a === 'hit') humanHit();
    else if (a === 'stand') humanStand();
    else if (a === 'rulesopen') { S.rules = true; render(); }
    else if (a === 'closerules') { S.rules = false; render(); }
    else if (a === 'start') { if (allowMatch()) beginRound(); }
    else if (a === 'next') nextRound();
    else if (a === 'newmatch') { if (allowMatch()) { initMatch(); beginRound(); } }
    else if (a === 'paywall') { S.paywall = { reason: 'upsell' }; S.codeMsg = ''; render(); }
    else if (a === 'closepay') { S.paywall = null; render(); }
    else if (a === 'redeem') redeem();
    else if (a === 'nativebuy') toApp('purchase');
    else if (a === 'nativerestore') toApp('restore');
  }
  // The Expo app passes the store's localized price so the paywall always shows the real amount.
  function setPrice(s) { if (s) { PRICE = String(s); render(); } }
  // The Expo app calls this after RevenueCat confirms (or revokes) the entitlement.
  function setPremium(on) {
    S.premium = !!on;
    if (S.premium) { S.paywall = null; log('Premium unlocked. The full deck arrives next round.'); }
    render();
  }
  function redeem() {
    var el = hasDom && $('#code');
    var v = el ? el.value : S.codeDraft;
    S.codeDraft = v;
    if (tryRedeem(v)) {
      S.paywall = null; S.codeDraft = ''; S.codeMsg = '';
      log('Premium unlocked. The full deck arrives next round.');
    } else {
      S.codeMsg = v.trim() ? 'That code is not valid. Check it and try again.' : 'Enter the code you received after paying.';
    }
    render();
  }

  if (hasDom) {
    document.addEventListener('click', onClick);
    document.addEventListener('input', function (e) { if (e.target && e.target.id === 'code') S.codeDraft = e.target.value; });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target && e.target.id === 'code') { redeem(); return; }
      if (e.key === 'Escape') {
        if (S.paywall) { S.paywall = null; render(); }
        else if (S.rules) { S.rules = false; render(); }
      }
    });
    initMatch();
  }

  var api = { S: S, setPremium: setPremium, setPrice: setPrice, FREE_KINDS: FREE_KINDS, ORDER: ORDER, HASHES: HASHES, sha256: sha256, codeHash: codeHash, tryRedeem: tryRedeem, allowMatch: allowMatch, matchesToday: matchesToday, initMatch: initMatch, beginRound: beginRound, nextRound: nextRound, total: total, ACTIONS: ACTIONS, WIN_POINTS: WIN_POINTS, render: render };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else if (typeof window !== 'undefined') window.T21 = api;
})();

</script>
</body>
</html>
